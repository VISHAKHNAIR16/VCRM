<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotation Tool — VIKRAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   TOKENS
══════════════════════════════════════════════════════════════ */
:root{
  --bg:          #0a0a0f;
  --surface:     #111118;
  --surface2:    #16161f;
  --surface3:    #1c1c28;
  --border:      rgba(255,255,255,0.07);
  --border-h:    rgba(255,255,255,0.14);
  --accent:      #e8c547;
  --accent-dim:  rgba(232,197,71,0.12);
  --accent-dim2: rgba(232,197,71,0.06);
  --accent-glow: rgba(232,197,71,0.18);
  --text:        #f0ede8;
  --muted:       #6b6880;
  --muted2:      #3d3b4a;
  --green:       #34d399;
  --green-bg:    rgba(52,211,153,0.08);
  --green-border:rgba(52,211,153,0.22);
  --red:         #f87171;
  --red-bg:      rgba(248,113,113,0.08);
  --sidebar-width: 380px;
}

/* ══════════════════════════════════════════════════════════════
   BASE
══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
}

body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(232,197,71,0.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(232,197,71,0.025) 1px,transparent 1px);
  background-size:60px 60px;
  pointer-events:none;z-index:0;
}

/* ══════════════════════════════════════════════════════════════
   HEADER
══════════════════════════════════════════════════════════════ */
.site-header{
  position:sticky;top:0;z-index:200;
  background:rgba(10,10,15,0.92);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;
  padding:0 24px;height:56px;
}

.header-back{
  display:flex;align-items:center;gap:6px;
  font-size:13px;color:var(--muted);
  text-decoration:none;transition:color .2s;
}
.header-back:hover{color:var(--accent)}
.header-back svg{transition:transform .2s}
.header-back:hover svg{transform:translateX(-2px)}

.header-sep{width:1px;height:20px;background:var(--border)}

.header-title{
  font-family:'Syne',sans-serif;
  font-size:15px;font-weight:700;
  letter-spacing:.04em;color:var(--text);
}

.header-fx{
  margin-left:auto;
  font-size:12px;color:var(--muted);
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:20px;
  padding:4px 12px;
  transition:color .3s;
}
.header-fx.loaded{color:var(--green)}

/* ══════════════════════════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════════════════════════ */
.app-layout{
  display:flex;
  min-height:calc(100vh - 56px);
  position:relative;z-index:1;
}

.main-content{
  flex:1;
  padding:24px 32px 32px;
  max-width:calc(100% - var(--sidebar-width));
  transition:max-width .3s ease;
}

/* ── Sidebar ──────────────────────────────────────────────────── */
.sidebar{
  position:sticky;top:56px;
  width:var(--sidebar-width);
  height:calc(100vh - 56px);
  background:var(--surface);
  border-left:1px solid var(--border);
  padding:20px 18px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  transition:transform .3s ease,width .3s ease;
  flex-shrink:0;
}

.sidebar-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-shrink:0;
}
.sidebar-header h2{
  font-family:'Syne',sans-serif;
  font-size:16px;font-weight:700;
  color:var(--text);
}
.sidebar-header .count{
  font-size:12px;color:var(--muted);
  background:var(--surface2);
  padding:2px 10px;border-radius:99px;
}

.sidebar-items{
  flex:1;
  overflow-y:auto;
  padding-right:4px;
  margin-bottom:12px;
}
.sidebar-items::-webkit-scrollbar{width:4px}
.sidebar-items::-webkit-scrollbar-track{background:transparent}
.sidebar-items::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:99px}

.cart-item{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:8px;
  transition:border-color .2s;
}
.cart-item:hover{border-color:var(--border-h)}

.cart-item-top{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:8px;
}
.cart-item-name{
  font-size:13px;font-weight:600;
  color:var(--text);
  flex:1;
}
.cart-item-remove{
  background:none;border:none;
  color:var(--muted2);cursor:pointer;
  font-size:16px;padding:2px 4px;
  border-radius:4px;line-height:1;
  transition:.15s;flex-shrink:0;
}
.cart-item-remove:hover{color:var(--red);background:var(--red-bg)}

.cart-item-details{
  font-size:11px;color:var(--muted);
  margin-top:4px;
  display:flex;flex-wrap:wrap;gap:4px 10px;
}
.cart-item-details span{display:inline-flex;align-items:center;gap:4px}
.cart-item-price{
  font-size:14px;font-weight:700;
  color:var(--accent);
  margin-top:6px;
}
.cart-item-price .usd{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px}

/* ── Sidebar footer ──────────────────────────────────────────── */
.sidebar-footer{
  flex-shrink:0;
  border-top:1px solid var(--border);
  padding-top:14px;
}

.commission-row{
  display:flex;align-items:center;gap:10px;
  margin-bottom:8px;
  flex-wrap:wrap;
}
.commission-row label{
  font-size:12px;color:var(--muted);
  white-space:nowrap;
}
.commission-row input{
  width:80px;
  padding:6px 10px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:6px;
  font-family:'DM Sans',sans-serif;
  font-size:13px;color:var(--text);
  outline:none;
}
.commission-row input:focus{border-color:var(--accent)}

.usd-rate-row{
  display:flex;align-items:center;gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.usd-rate-row label{
  font-size:12px;color:var(--muted);
  white-space:nowrap;
}
.usd-rate-row input{
  width:100px;
  padding:6px 10px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:6px;
  font-family:'DM Sans',sans-serif;
  font-size:13px;color:var(--text);
  outline:none;
}
.usd-rate-row input:focus{border-color:var(--accent)}
.usd-rate-row .hint{
  font-size:11px;color:var(--muted2);
}

.sidebar-total{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0 4px;
}
.sidebar-total .label{font-size:13px;color:var(--muted)}
.sidebar-total .amount{
  font-size:20px;font-weight:800;
  color:var(--text);
}
.sidebar-total .amount .usd{
  font-size:13px;color:var(--muted);font-weight:400;margin-left:6px;
}

.sidebar-actions{
  display:flex;gap:8px;margin-top:10px;
}
.sidebar-actions .btn{
  flex:1;justify-content:center;
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 16px;border-radius:8px;
  font-family:'DM Sans',sans-serif;
  font-size:13px;font-weight:600;
  cursor:pointer;border:none;
  transition:background .15s,box-shadow .15s,transform .1s;
}
.btn:active{transform:scale(.97)}

.btn-primary{
  background:var(--accent);color:#0a0a0f;font-weight:700;
}
.btn-primary:hover{background:#f0d060;box-shadow:0 4px 16px var(--accent-glow)}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none}

.btn-ghost{
  background:transparent;color:var(--muted);
  border:1px solid var(--border);
}
.btn-ghost:hover{color:var(--text);border-color:var(--border-h);background:var(--surface2)}

.btn-danger-ghost{
  background:transparent;color:var(--muted);
  border:1px solid var(--muted2);
}
.btn-danger-ghost:hover{color:var(--red);border-color:var(--red);background:var(--red-bg)}

.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}

/* ══════════════════════════════════════════════════════════════
   SEARCH
══════════════════════════════════════════════════════════════ */
.search-section{
  margin-bottom:24px;
}

.search-bar{
  display:flex;gap:12px;align-items:center;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:4px 16px 4px 20px;
  transition:border-color .2s,box-shadow .2s;
}
.search-bar:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-dim);
}

.search-bar input{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  font-family:'DM Sans',sans-serif;
  font-size:15px;
  color:var(--text);
  padding:12px 0;
}
.search-bar input::placeholder{color:var(--muted2)}

.search-bar .btn{
  flex-shrink:0;
  padding:8px 20px;
}

.search-hint{
  font-size:12px;color:var(--muted2);
  margin-top:8px;
  padding-left:4px;
}

/* ══════════════════════════════════════════════════════════════
   RESULTS
══════════════════════════════════════════════════════════════ */
.results-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;
}
.results-header .count{
  font-size:13px;color:var(--muted);
}
.results-header .clear-btn{
  font-size:12px;color:var(--muted2);
  background:none;border:none;cursor:pointer;
  transition:color .2s;
}
.results-header .clear-btn:hover{color:var(--text)}

@keyframes cardIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}

.result-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:10px;
  padding:16px 20px;
  cursor:pointer;
  transition:border-color .2s,box-shadow .2s,background .2s;
  animation:cardIn .3s ease both;
  user-select:none;
}
.result-card:hover{
  border-color:var(--border-h);
  background:var(--surface2);
}
.result-card.selected{
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent-dim),0 4px 20px rgba(0,0,0,.2);
}

.result-card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  pointer-events:auto;
  cursor:pointer;
}
.result-card-top .badge{
  font-size:10px;font-weight:600;
  padding:1px 8px;border-radius:4px;
  background:var(--surface3);
  color:var(--muted);
  border:1px solid var(--border);
}
.result-card-top .badge-dest{
  background:var(--accent-dim);
  color:var(--accent);
  border-color:rgba(232,197,71,0.2);
}

.result-card-name{
  font-size:15px;font-weight:600;color:var(--text);
}
.result-card-meta{
  font-size:12px;color:var(--muted);
  margin-top:4px;
  display:flex;flex-wrap:wrap;gap:4px 12px;
}
.result-card-price-preview{
  font-size:13px;color:var(--muted2);
  white-space:nowrap;
  flex-shrink:0;
  padding-top:2px;
}
.result-card-price-preview strong{color:var(--text)}

/* ── Service detail ──────────────────────────────────────────── */
.service-detail{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--border);
  display:none;
  pointer-events:auto;
}
.result-card.selected .service-detail{display:block}

.detail-section{margin-bottom:14px}
.detail-section-title{
  font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted2);
  margin-bottom:8px;
}

.detail-rate-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:8px;
}
.rate-option{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px 12px;
  cursor:pointer;
  transition:border-color .2s,background .2s;
  text-align:left;
  user-select:none;
}
.rate-option:hover{border-color:var(--border-h);background:var(--surface3)}
.rate-option.selected{
  border-color:var(--accent);
  background:var(--accent-dim);
}
.rate-option .vehicle{
  font-size:13px;font-weight:600;color:var(--text);
}
.rate-option .pax-info{
  font-size:11px;color:var(--muted);
}
.rate-option .price{
  font-size:14px;font-weight:700;color:var(--accent);
  margin-top:4px;
}
.rate-option .price .per{font-size:11px;font-weight:400;color:var(--muted)}

.detail-addons{margin-top:10px}
.addon-option{
  display:flex;align-items:center;gap:10px;
  padding:6px 0;border-bottom:1px solid var(--border);
  font-size:13px;
}
.addon-option:last-child{border-bottom:none}
.addon-option input[type="checkbox"]{
  accent-color:var(--accent);
  width:16px;height:16px;cursor:pointer;
}
.addon-option .addon-price{color:var(--muted);font-size:12px;margin-left:auto}

.detail-add-btn{
  margin-top:12px;
  width:100%;
}
.detail-add-btn:disabled{opacity:0.4;cursor:not-allowed}

.empty-state{
  text-align:center;padding:60px 24px;
  color:var(--muted);
  background:var(--surface);
  border:1px dashed var(--border);
  border-radius:12px;
}
.empty-state svg{display:block;margin:0 auto 16px;opacity:.3}
.empty-state .sub{font-size:13px;color:var(--muted2);margin-top:4px}

/* ══════════════════════════════════════════════════════════════
   SPINNER
══════════════════════════════════════════════════════════════ */
.spinner{
  display:inline-block;width:16px;height:16px;
  border:2px solid rgba(10,10,15,.3);
  border-top-color:#0a0a0f;
  border-radius:50%;
  animation:spin .65s linear infinite;
  vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════════════════════════════════════════════════════════════
   MODAL
══════════════════════════════════════════════════════════════ */
@keyframes modalBg{from{opacity:0}to{opacity:1}}
@keyframes modalBox{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:none}}

#quotation-modal{
  display:none;position:fixed;inset:0;z-index:400;
  background:rgba(0,0,0,.7);
  align-items:center;justify-content:center;
  padding:16px;
  animation:modalBg .2s ease;
}
#quotation-modal.visible{display:flex}

.modal-box{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  width:100%;max-width:600px;
  max-height:90vh;
  display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(0,0,0,.6);
  animation:modalBox .22s ease;
}

.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 22px 16px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.modal-header h3{
  font-family:'Syne',sans-serif;
  font-size:17px;font-weight:700;color:var(--text);
}
.modal-close{
  background:none;border:none;
  color:var(--muted);font-size:20px;cursor:pointer;
  padding:4px 8px;border-radius:6px;
  line-height:1;transition:.15s;
}
.modal-close:hover{background:var(--surface2);color:var(--text)}

.modal-body{padding:20px 22px;overflow-y:auto;flex:1}
.modal-footer{
  padding:14px 22px;border-top:1px solid var(--border);
  display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;
}

.quotation-pre{
  font-family:'Courier New',Courier,monospace;
  font-size:12.5px;line-height:1.7;
  white-space:pre-wrap;word-break:break-word;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:14px 16px;color:var(--text);
  max-height:300px;overflow-y:auto;
}

/* ══════════════════════════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════════════════════════ */
@media(max-width:820px){
  :root{--sidebar-width: 320px}
  .main-content{padding:16px 16px 24px;max-width:100%}
  .sidebar{
    position:fixed;bottom:0;left:0;right:0;top:auto;
    width:100%;height:50vh;
    border-left:none;border-top:1px solid var(--border);
    border-radius:16px 16px 0 0;
    transform:translateY(calc(100% - 60px));
    padding:12px 16px;
    background:rgba(17,17,24,0.98);
    backdrop-filter:blur(20px);
    z-index:100;
  }
  .sidebar.open{transform:translateY(0)}
  .sidebar-handle{
    display:block !important;
    width:40px;height:4px;
    background:var(--muted2);
    border-radius:99px;
    margin:0 auto 12px;
    cursor:pointer;
  }
  .sidebar-items{max-height:calc(50vh - 220px)}
  .detail-rate-grid{grid-template-columns:1fr 1fr}
}

.sidebar-handle{display:none}

.service-detail::-webkit-scrollbar{width:4px}
.service-detail::-webkit-scrollbar-track{background:transparent}
.service-detail::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:99px}
</style>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────────────────────────── -->
<header class="site-header">
  <a href="/home" class="header-back">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
      <path d="M10 4L6 8l4 4" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Home
  </a>
  <div class="header-sep"></div>
  <span class="header-title">Quotation Tool</span>
  <span class="header-fx" id="fx-label">Loading rates…</span>
</header>

<!-- ── APP LAYOUT ───────────────────────────────────────────────────────────── -->
<div class="app-layout">

  <!-- ── MAIN CONTENT ──────────────────────────────────────────────────────── -->
  <div class="main-content">

    <!-- Search -->
    <div class="search-section">
      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted2)" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search-input" 
               placeholder="Search services by name, destination, or type…"
               oninput="debouncedSearch()"
               autofocus>
        <button class="btn btn-primary" onclick="doSearch()">
          <span id="search-spinner" style="display:none" class="spinner"></span>
          Search
        </button>
      </div>
      <div class="search-hint" id="search-hint">Type at least 2 characters to search</div>
    </div>

    <!-- Results -->
    <div class="results-header">
      <span class="count" id="result-count"></span>
      <button class="clear-btn" onclick="clearSearch()" id="clear-btn" style="display:none">Clear results</button>
    </div>
    <div id="results-list"></div>

  </div>

  <!-- ── SIDEBAR (Cart) ────────────────────────────────────────────────────── -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-handle" onclick="toggleSidebar()"></div>

    <div class="sidebar-header">
      <h2>🛒 Cart</h2>
      <span class="count" id="cart-count">0 items</span>
    </div>

    <div class="sidebar-items" id="cart-items">
      <div style="text-align:center;color:var(--muted2);font-size:13px;padding:40px 0;">
        No items added yet.<br>
        Search for services and click <strong>Add to Cart</strong>.
      </div>
    </div>

    <div class="sidebar-footer">
      <!-- USD Rate -->
      <div class="usd-rate-row">
        <label>USD Rate</label>
        <input type="number" id="usd-rate-input" value="34.00" min="0" step="0.01"
               oninput="updateCartTotals()">
        <span class="hint">THB/USD</span>
      </div>

      <!-- Commission -->
      <div class="commission-row">
        <label>Commission</label>
        <input type="number" id="commission-input" value="0" min="0" max="100" step="0.5"
               oninput="updateCartTotals()">
        <label style="font-size:12px;color:var(--muted2)">%</label>
      </div>

      <div class="sidebar-total">
        <span class="label">Total</span>
        <span class="amount" id="cart-total">฿0</span>
      </div>

      <div class="sidebar-actions">
        <button class="btn btn-danger-ghost btn-sm" onclick="clearCart()">Clear</button>
        <button class="btn btn-primary" onclick="showModal()" id="generate-btn" disabled>
          Generate Quote
        </button>
      </div>
    </div>
  </div>

</div>

<!-- ── MODAL ────────────────────────────────────────────────────────────────── -->
<div id="quotation-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-header">
      <h3>📋 Quotation</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <pre class="quotation-pre" id="quotation-text"></pre>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Close</button>
      <button class="btn btn-primary btn-sm" id="copy-btn" onclick="copyQuotation()">
        Copy to Clipboard
      </button>
    </div>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════════════════════════
     JAVASCRIPT (with DEBUG statements)
═══════════════════════════════════════════════════════════════════════════ -->
<script>
// ── STATE ─────────────────────────────────────────────────────────────────────
let fxRate       = null;
let cart         = [];
let selectedService = null;
let allResults   = [];
let searchTimeout = null;



// ── AUTH-AWARE FETCH ──────────────────────────────────────────────────────────
async function apiFetch(url) {

  const r = await fetch(url);
  if (r.status === 401) { 

    window.location.href = '/login'; 
    return null; 
  }
  return r;
}

// ── FX ────────────────────────────────────────────────────────────────────────
async function loadFx() {
  try {
    const r = await apiFetch('/quotation/api/fx');
    if (!r) return;
    const d = await r.json();
    fxRate = d.thb_per_usd;
    const el = document.getElementById('fx-label');
    if (fxRate) {
      el.textContent = `1 USD = ฿${fxRate.toFixed(2)}`;
      el.classList.add('loaded');
      document.getElementById('usd-rate-input').value = fxRate.toFixed(2);
    } else {
      el.textContent = 'FX unavailable';
    }
    updateCartTotals();
  } catch (e) {
    document.getElementById('fx-label').textContent = 'FX unavailable';
  }
}

function getUsdRate() {
  const rate = parseFloat(document.getElementById('usd-rate-input').value) || 34.00;
  return rate;
}

function thbToUsd(thb) {
  const rate = getUsdRate();
  return (rate && thb) ? (thb / rate).toFixed(2) : null;
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
function debouncedSearch() {

  clearTimeout(searchTimeout);
  const q = document.getElementById('search-input').value.trim();

  if (q.length < 2) {
    document.getElementById('search-hint').textContent = 'Type at least 2 characters to search';
    return;
  }
  document.getElementById('search-hint').textContent = 'Searching…';
  searchTimeout = setTimeout(() => {
    doSearch();
  }, 400);
}

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (q.length < 2) {
    return;
  }

  const spinner = document.getElementById('search-spinner');
  spinner.style.display = 'inline-block';

  const list = document.getElementById('results-list');
  list.innerHTML = `<div class="empty-state"><span class="spinner" style="margin-right:0;display:inline-block;width:24px;height:24px;border-width:3px"></span><br>Searching…</div>`;

  const url = `/quotation/api/search?q=${encodeURIComponent(q)}&limit=50`;
  
  const r = await apiFetch(url);
  spinner.style.display = 'none';

  if (!r) {
    return;
  }
  
  const data = await r.json();

  if (data.error) {
    list.innerHTML = `<div class="empty-state">Error: ${data.error}</div>`;
    return;
  }

  allResults = data;
  for (const svc of allResults) {
    svc._selectedRate = null;
    svc._selectedAddons = [];
  }
  selectedService = null;

  document.getElementById('result-count').textContent = `${data.length} result${data.length > 1 ? 's' : ''}`;
  document.getElementById('clear-btn').style.display = data.length ? 'inline' : 'none';
  document.getElementById('search-hint').textContent = data.length ? '' : 'No results found — try a different search';

  if (!data.length) {
    list.innerHTML = `<div class="empty-state">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      No services found
    </div>`;
    return;
  }

  list.innerHTML = data.map((svc, i) => renderResultCard(svc, i)).join('');
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('results-list').innerHTML = '';
  document.getElementById('result-count').textContent = '';
  document.getElementById('clear-btn').style.display = 'none';
  document.getElementById('search-hint').textContent = 'Type at least 2 characters to search';
  allResults = [];
  selectedService = null;
}

function renderResultCard(svc, idx) {
  const isSelected = selectedService === svc.id;
  const pricePreview = svc.rates && svc.rates.length 
    ? `from ฿${Math.min(...svc.rates.map(r => r.price_thb)).toLocaleString()}`
    : 'No rates';

  return `
<div class="result-card ${isSelected ? 'selected' : ''}" 
     style="animation-delay:${Math.min(idx * 50, 400)}ms"
     data-service-id="${svc.id}">
  <div class="result-card-top" onclick="toggleService(${svc.id})">
    <div>
      <div class="result-card-name">${escHtml(svc.name)}</div>
      <div class="result-card-meta">
        <span class="badge badge-dest">${escHtml(svc.destination)}</span>
        <span class="badge">${escHtml(svc.service_type)}</span>
        ${svc.supplier ? `<span class="badge" style="background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.1);color:var(--muted)">${escHtml(svc.supplier)}</span>` : ''}
        ${svc.tour_code ? `<span class="badge">${escHtml(svc.tour_code)}</span>` : ''}
        ${svc.duration ? `<span>${escHtml(svc.duration)}</span>` : ''}
      </div>
    </div>
    <div class="result-card-price-preview">
      <strong>${pricePreview}</strong>
    </div>
  </div>
  <div class="service-detail">
    ${renderServiceDetail(svc)}
  </div>
</div>`;
}

function renderServiceDetail(svc) {
  const rates = svc.rates || [];
  const privateRates = rates.filter(r => r.rate_type === 'Private');
  const sicRates = rates.filter(r => r.rate_type === 'SIC');

  let html = '';

  // Private rates
  if (privateRates.length) {
    html += `<div class="detail-section">
      <div class="detail-section-title">🚗 Private (per vehicle)</div>
      <div class="detail-rate-grid">`;
    const byVehicle = {};
    for (const r of privateRates) {
      const key = r.vehicle || 'N/A';
      if (!byVehicle[key]) byVehicle[key] = [];
      byVehicle[key].push(r);
    }
    for (const [vehicle, rows] of Object.entries(byVehicle)) {
      const bestPrice = Math.min(...rows.map(r => r.price_thb));
      const paxInfo = rows.map(r => r.pax_range).filter(Boolean).join(', ');
      const isSelected = svc._selectedRate && svc._selectedRate.vehicle === vehicle && svc._selectedRate.rateType === 'Private';
      html += `
        <div class="rate-option ${isSelected ? 'selected' : ''}" 
             onclick="event.stopPropagation();selectRate(${svc.id}, 'Private', '${escHtml(vehicle)}', ${bestPrice}, '${escHtml(paxInfo)}')">
          <div class="vehicle">${escHtml(vehicle)}</div>
          <div class="pax-info">${paxInfo || 'All pax'}</div>
          <div class="price">฿${bestPrice.toLocaleString()}</div>
        </div>`;
    }
    html += `</div></div>`;
  }

  // SIC rates
  if (sicRates.length) {
    html += `<div class="detail-section">
      <div class="detail-section-title">👥 SIC (per person, join tour)</div>
      <div class="detail-rate-grid">`;
    const adults = sicRates.find(r => r.pax_category === 'Adult');
    const children = sicRates.find(r => r.pax_category === 'Child');
    if (adults) {
      const isSelected = svc._selectedRate && svc._selectedRate.rateType === 'SIC' && svc._selectedRate.paxCategory === 'Adult';
      html += `
        <div class="rate-option ${isSelected ? 'selected' : ''}" 
             onclick="event.stopPropagation();selectRate(${svc.id}, 'SIC', 'Adult', ${adults.price_thb}, '')">
          <div class="vehicle">Adult</div>
          <div class="price">฿${adults.price_thb.toLocaleString()}</div>
        </div>`;
    }
    if (children) {
      const isSelected = svc._selectedRate && svc._selectedRate.rateType === 'SIC' && svc._selectedRate.paxCategory === 'Child';
      html += `
        <div class="rate-option ${isSelected ? 'selected' : ''}" 
             onclick="event.stopPropagation();selectRate(${svc.id}, 'SIC', 'Child', ${children.price_thb}, '')">
          <div class="vehicle">Child</div>
          <div class="price">฿${children.price_thb.toLocaleString()}</div>
        </div>`;
    }
    html += `</div></div>`;
  }

  // Add-ons
  if (svc.addons && svc.addons.length) {
    html += `<div class="detail-section detail-addons">
      <div class="detail-section-title">➕ Add-ons</div>`;
    for (const addon of svc.addons) {
      const price = addon.price_adult || addon.price_child || 0;
      const isChecked = svc._selectedAddons && svc._selectedAddons.some(a => a.name === addon.addon_name);
      html += `
        <div class="addon-option">
          <input type="checkbox" id="addon-${svc.id}-${addon.addon_name}" 
                 ${isChecked ? 'checked' : ''}
                 onchange="toggleAddon(${svc.id}, '${escHtml(addon.addon_name)}', ${price})">
          <label for="addon-${svc.id}-${addon.addon_name}">${escHtml(addon.addon_name)}</label>
          <span class="addon-price">฿${price.toLocaleString()}</span>
        </div>`;
    }
    html += `</div>`;
  }

  // Notes
  if (svc.notes) {
    html += `<div style="font-size:12px;color:var(--muted);margin-top:8px">📝 ${escHtml(svc.notes)}</div>`;
  }

  const hasSelected = svc._selectedRate !== null;
  const hintText = hasSelected 
    ? `Selected: ${svc._selectedRate.vehicle || svc._selectedRate.paxCategory} — ฿${svc._selectedRate.price.toLocaleString()}`
    : 'Select a rate above first';

  html += `
    <button class="btn btn-primary detail-add-btn" id="add-btn-${svc.id}" 
            onclick="event.stopPropagation();addToCartFromDetail(${svc.id})" 
            ${!hasSelected ? 'disabled' : ''}>
      Add to Cart
    </button>
    <div style="font-size:11px;color:var(--muted2);margin-top:4px;text-align:center" id="add-hint-${svc.id}">
      ${hintText}
    </div>`;

  return html;
}

// ── SERVICE INTERACTION ──────────────────────────────────────────────────────
function toggleService(id) {
  
  // If clicking the same card, deselect it
  if (selectedService === id) {
    selectedService = null;
    const card = document.querySelector(`.result-card[data-service-id="${id}"]`);
    if (card) {
      card.classList.remove('selected');
    } else {
    }
    return;
  }
  
  // Close other cards
  document.querySelectorAll('.result-card.selected').forEach(el => {
    el.classList.remove('selected');
  });
  
  // Select this card
  selectedService = id;
  const card = document.querySelector(`.result-card[data-service-id="${id}"]`);
  if (card) {
    card.classList.add('selected');
  } else {
    return;
  }
  
  // Update hint
  const svc = allResults.find(s => s.id === id);
  if (svc) {
    if (!svc._selectedRate) {
      document.getElementById(`add-btn-${id}`).disabled = true;
      document.getElementById(`add-hint-${id}`).textContent = 'Select a rate above first';
    } else {
      document.getElementById(`add-btn-${id}`).disabled = false;
      document.getElementById(`add-hint-${id}`).textContent = 
        `Selected: ${svc._selectedRate.vehicle || svc._selectedRate.paxCategory} — ฿${svc._selectedRate.price.toLocaleString()}`;
    }
  } else {
  }
}

function selectRate(serviceId, rateType, vehicle, price, paxInfo) {
  const svc = allResults.find(s => s.id === serviceId);
  if (!svc) {
    return;
  }

  // Toggle: if clicking the same rate, deselect it
  if (svc._selectedRate && 
      svc._selectedRate.rateType === rateType && 
      svc._selectedRate.vehicle === vehicle &&
      svc._selectedRate.price === price) {
    svc._selectedRate = null;
  } else {
    svc._selectedRate = { rateType, vehicle, paxInfo, price, paxCategory: vehicle };
  }


  // Re-render the detail section
  const card = document.querySelector(`.result-card[data-service-id="${serviceId}"]`);
  if (card) {
    const detail = card.querySelector('.service-detail');
    if (detail) {
      detail.innerHTML = renderServiceDetail(svc);
    }
    // Update selected state on the card
    if (svc._selectedRate) {
      card.classList.add('selected');
    }
  }

  // Update button state
  const btn = document.getElementById(`add-btn-${serviceId}`);
  const hint = document.getElementById(`add-hint-${serviceId}`);
  if (svc._selectedRate) {
    if (btn) btn.disabled = false;
    if (hint) hint.textContent = `Selected: ${svc._selectedRate.vehicle || svc._selectedRate.paxCategory} — ฿${svc._selectedRate.price.toLocaleString()}`;
  } else {
    if (btn) btn.disabled = true;
    if (hint) hint.textContent = 'Select a rate above first';
  }
}

function toggleAddon(serviceId, addonName, price) {
  const svc = allResults.find(s => s.id === serviceId);
  if (!svc) {
    return;
  }
  if (!svc._selectedAddons) svc._selectedAddons = [];
  
  const idx = svc._selectedAddons.findIndex(a => a.name === addonName);
  if (idx >= 0) {
    svc._selectedAddons.splice(idx, 1);
  } else {
    svc._selectedAddons.push({ name: addonName, price });
  }
}

function addToCartFromDetail(serviceId) {
  const svc = allResults.find(s => s.id === serviceId);
  if (!svc) {
    alert('Service not found.');
    return;
  }
  if (!svc._selectedRate) {
    alert('Please select a rate first.');
    return;
  }

  const { rateType, vehicle, price, paxCategory } = svc._selectedRate;
  const addons = svc._selectedAddons || [];
  const addonTotal = addons.reduce((sum, a) => sum + a.price, 0);

  const cartItem = {
    id: Date.now() + Math.random(),
    serviceId: svc.id,
    name: svc.name,
    destination: svc.destination,
    serviceType: svc.service_type,
    rateType: rateType,
    vehicle: vehicle || paxCategory || 'N/A',
    basePrice: price,
    addons: [...addons],
    addonTotal: addonTotal,
    totalPrice: price + addonTotal,
    quantity: 1,
  };

  cart.push(cartItem);
  
  renderCart();
  updateCartTotals();
  
  // Feedback
  const btn = document.getElementById(`add-btn-${serviceId}`);
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = '✓ Added!';
    btn.style.background = 'var(--green)';
    btn.style.color = '#0a0a0f';
    setTimeout(() => {
      btn.textContent = orig;
      btn.style.background = '';
      btn.style.color = '';
    }, 1500);
  }
}

// ── CART ──────────────────────────────────────────────────────────────────────
function renderCart() {
  const container = document.getElementById('cart-items');
  const count = document.getElementById('cart-count');

  if (!cart.length) {
    container.innerHTML = `
      <div style="text-align:center;color:var(--muted2);font-size:13px;padding:40px 0;">
        No items added yet.<br>
        Search for services and click <strong>Add to Cart</strong>.
      </div>`;
    count.textContent = '0 items';
    document.getElementById('generate-btn').disabled = true;
    return;
  }

  count.textContent = `${cart.length} item${cart.length > 1 ? 's' : ''}`;
  document.getElementById('generate-btn').disabled = false;

  container.innerHTML = cart.map((item, idx) => {
    const usd = thbToUsd(item.totalPrice);
    return `
    <div class="cart-item">
      <div class="cart-item-top">
        <div class="cart-item-name">${escHtml(item.name)}</div>
        <button class="cart-item-remove" onclick="removeFromCart(${idx})" title="Remove">✕</button>
      </div>
      <div class="cart-item-details">
        <span>${escHtml(item.destination)}</span>
        <span>${escHtml(item.serviceType)}</span>
        <span>${escHtml(item.rateType)}</span>
        <span>${escHtml(item.vehicle)}</span>
      </div>
      ${item.addons.length ? `<div class="cart-item-details" style="color:var(--accent-dim)">+ ${item.addons.map(a => a.name).join(', ')}</div>` : ''}
      <div class="cart-item-price">
        ฿${item.totalPrice.toLocaleString()}
        ${usd ? `<span class="usd">≈ $${usd}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

function removeFromCart(idx) {
  cart.splice(idx, 1);
  renderCart();
  updateCartTotals();
}

function clearCart() {
  cart = [];
  renderCart();
  updateCartTotals();
  for (const svc of allResults) {
    svc._selectedRate = null;
    svc._selectedAddons = [];
    const btn = document.getElementById(`add-btn-${svc.id}`);
    if (btn) btn.disabled = true;
    const hint = document.getElementById(`add-hint-${svc.id}`);
    if (hint) hint.textContent = 'Select a rate above first';
  }
  document.querySelectorAll('.rate-option.selected').forEach(el => el.classList.remove('selected'));
}

function roundToNearestHalf(value) {
  return Math.round(value * 2) / 2;
}

function updateCartTotals() {
  const comm = parseFloat(document.getElementById('commission-input').value) || 100;
  const subtotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
  const commissionAmount = subtotal / (comm / 100);
  const total =  roundToNearestHalf(commissionAmount);

  const usd = thbToUsd(total);
  document.getElementById('cart-total').innerHTML = `
    ฿${total.toLocaleString()}
    ${usd ? `<span class="usd">≈ $${usd}</span>` : ''}
  `;
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function showModal() {
  if (!cart.length) {
    return;
  }
  renderQuotationText();
  document.getElementById('quotation-modal').classList.add('visible');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('quotation-modal').classList.remove('visible');
  document.body.style.overflow = '';
}



function buildQuotationText() {
  const today = new Date().toLocaleDateString('en-GB', {
    day:'2-digit', month:'short', year:'numeric', timeZone:'Asia/Bangkok'
  });
  const comm = parseFloat(document.getElementById('commission-input').value) || 100;
  const usdRate = getUsdRate();
  const subtotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
  const commissionAmount = subtotal / (comm / 100);
  const grandTotal = roundToNearestHalf(commissionAmount);
  const div = '─'.repeat(30);

  const lines = [
    `*VAYO AURA — Service Quotation*`,
    `Date: ${today}`,
    div, '',
  ];

  cart.forEach((item, i) => {
    const itemUsd = thbToUsd(item.totalPrice);
    lines.push(`*${i+1}. ${item.name}*`);
    lines.push(`   Type: ${item.rateType} · ${item.vehicle}`);
    lines.push(`   ${item.destination} · ${item.serviceType}`);
    if (item.addons.length) {
      lines.push(`   Add-ons: ${item.addons.map(a => a.name).join(', ')}`);
    }
  });

  const grandUsd = thbToUsd(grandTotal);
  lines.push(div);
  lines.push(`*GRAND TOTAL: ฿${grandTotal.toLocaleString()}*`);
  if (grandUsd) lines.push(`*≈ $${grandUsd} USD*`);
  lines.push(div);
  lines.push('');
  lines.push(`_All prices in Thai Baht (THB)_`);
  lines.push(`_Prices are indicative and subject to availability_`);
  lines.push('');
  lines.push(`For bookings & queries:`);
  lines.push(`+66 960 877 457 | info@vayoaura.com`);
  return lines.join('\n');
}

function renderQuotationText() {
  document.getElementById('quotation-text').textContent = buildQuotationText();
}

async function copyQuotation() {
  const text = document.getElementById('quotation-text').textContent;
  const btn = document.getElementById('copy-btn');
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = Object.assign(document.createElement('textarea'), {
      value:text, style:'position:fixed;opacity:0'
    });
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
  }
  btn.textContent = '✓ Copied!';
  setTimeout(() => btn.textContent = 'Copy to Clipboard', 2200);
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function escHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadFx();

// Handle Enter key on search
document.getElementById('search-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { 
    e.preventDefault(); 
    doSearch(); 
  }
});

// Close sidebar on mobile when clicking outside
document.addEventListener('click', (e) => {
  const sidebar = document.getElementById('sidebar');
  if (window.innerWidth <= 820 && sidebar.classList.contains('open')) {
    if (!sidebar.contains(e.target) && !e.target.closest('.sidebar-handle')) {
      sidebar.classList.remove('open');
    }
  }
});

</script>
</body>
</html>
