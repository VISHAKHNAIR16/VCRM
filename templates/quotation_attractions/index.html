<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attraction Quotations — VIKRAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
<!-- SheetJS for Excel export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ══════════════════════════════════════════════════════════════
   TOKENS
══════════════════════════════════════════════════════════════ */
:root{
  --bg:          #0a0a0f;
  --surface:     #111118;
  --surface2:    #16161f;
  --surface3:    #1c1c28;
  --border:      rgba(255,255,255,0.07);
  --border-h:    rgba(255,255,255,0.14);
  --accent:      #e8c547;
  --accent-dim:  rgba(232,197,71,0.12);
  --accent-dim2: rgba(232,197,71,0.06);
  --accent-glow: rgba(232,197,71,0.18);
  --text:        #f0ede8;
  --muted:       #6b6880;
  --muted2:      #3d3b4a;
  --green:       #34d399;
  --green-bg:    rgba(52,211,153,0.08);
  --green-border:rgba(52,211,153,0.22);
  --red:         #f87171;
  --red-bg:      rgba(248,113,113,0.08);
  --sidebar-width: 380px;
}

/* ══════════════════════════════════════════════════════════════
   BASE
══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(232,197,71,0.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(232,197,71,0.025) 1px,transparent 1px);
  background-size:60px 60px;
  pointer-events:none;z-index:0;
}

/* ══════════════════════════════════════════════════════════════
   HEADER
══════════════════════════════════════════════════════════════ */
.site-header{
  position:sticky;top:0;z-index:200;
  background:rgba(10,10,15,0.92);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;
  padding:0 24px;height:56px;
}
.header-back{
  display:flex;align-items:center;gap:6px;
  font-size:13px;color:var(--muted);
  text-decoration:none;transition:color .2s;
}
.header-back:hover{color:var(--accent)}
.header-back svg{transition:transform .2s}
.header-back:hover svg{transform:translateX(-2px)}
.header-sep{width:1px;height:20px;background:var(--border)}
.header-title{
  font-family:'Syne',sans-serif;
  font-size:15px;font-weight:700;
  letter-spacing:.04em;color:var(--text);
}
.header-badge{
  margin-left:auto;
  font-size:12px;color:var(--muted);
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:20px;
  padding:4px 12px;
}

/* ══════════════════════════════════════════════════════════════
   FILTERS SECTION - Only City & Supplier
══════════════════════════════════════════════════════════════ */
.filters-section{
  margin-bottom:20px;
}
.filters-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 16px;
}
.filter-group{
  display:flex;
  align-items:center;
  gap:8px;
  flex:1 1 140px;
  min-width:120px;
  position:relative;
}
.filter-group label{
  font-size:11px;
  font-weight:600;
  letter-spacing:0.05em;
  text-transform:uppercase;
  color:var(--muted);
  white-space:nowrap;
}
.filter-group .filter-input-wrap{
  position:relative;
  flex:1;
}
.filter-group input{
  width:100%;
  padding:6px 28px 6px 10px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:6px;
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  color:var(--text);
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.filter-group input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-dim);
}
.filter-group input::placeholder{
  color:var(--muted2);
}
.filter-group .dropdown-arrow{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  pointer-events:none;
  color:var(--muted2);
  font-size:10px;
}
.filter-group .filter-dropdown{
  position:absolute;
  top:calc(100% + 4px);
  left:0;
  right:0;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:6px;
  max-height:200px;
  overflow-y:auto;
  display:none;
  z-index:50;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.filter-group .filter-dropdown.open{
  display:block;
}
.filter-group .filter-dropdown .option{
  padding:8px 12px;
  cursor:pointer;
  font-size:13px;
  color:var(--text);
  transition:background .15s;
}
.filter-group .filter-dropdown .option:hover{
  background:var(--surface3);
}
.filter-group .filter-dropdown .option.highlight{
  background:var(--accent-dim);
}
.filter-group .filter-dropdown .option.empty{
  color:var(--muted2);
  cursor:default;
  font-style:italic;
}
.filter-group .filter-dropdown .option.empty:hover{
  background:transparent;
}

.filter-divider{
  width:1px;
  height:24px;
  background:var(--border);
  flex-shrink:0;
}
.filter-clear-btn{
  display:flex;
  align-items:center;
  gap:4px;
  padding:5px 12px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:6px;
  font-family:'DM Sans',sans-serif;
  font-size:12px;
  color:var(--muted);
  cursor:pointer;
  transition:color .2s,border-color .2s,background .2s;
  white-space:nowrap;
}
.filter-clear-btn:hover{
  color:var(--text);
  border-color:var(--border-h);
  background:var(--surface3);
}
.filter-clear-btn.has-filters{
  color:var(--accent);
  border-color:rgba(232,197,71,0.3);
}
.filter-clear-btn.has-filters:hover{
  background:var(--accent-dim);
}

.active-filters{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
  padding-left:4px;
}
.filter-pill{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:11px;
  padding:3px 8px 3px 10px;
  background:var(--accent-dim);
  border:1px solid rgba(232,197,71,0.2);
  border-radius:99px;
  color:var(--accent);
}
.filter-pill .remove{
  cursor:pointer;
  opacity:0.6;
  transition:opacity .2s;
  font-size:12px;
  line-height:1;
}
.filter-pill .remove:hover{
  opacity:1;
}

/* ══════════════════════════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════════════════════════ */
.app-layout{
  display:flex;
  min-height:calc(100vh - 56px);
  position:relative;z-index:1;
}
.main-content{
  flex:1;
  padding:24px 32px 32px;
  max-width:calc(100% - var(--sidebar-width));
  transition:max-width .3s ease;
}

/* ── Sidebar ──────────────────────────────────────────────────── */
.sidebar{
  position:sticky;top:56px;
  width:var(--sidebar-width);
  height:calc(100vh - 56px);
  background:var(--surface);
  border-left:1px solid var(--border);
  padding:20px 18px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  transition:transform .3s ease,width .3s ease;
  flex-shrink:0;
}
.sidebar-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-shrink:0;
}
.sidebar-header h2{
  font-family:'Syne',sans-serif;
  font-size:16px;font-weight:700;
  color:var(--text);
}
.sidebar-header .count{
  font-size:12px;color:var(--muted);
  background:var(--surface2);
  padding:2px 10px;border-radius:99px;
}
.sidebar-items{
  flex:1;
  overflow-y:auto;
  padding-right:4px;
  margin-bottom:12px;
}
.sidebar-items::-webkit-scrollbar{width:4px}
.sidebar-items::-webkit-scrollbar-track{background:transparent}
.sidebar-items::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:99px}

.cart-item{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:8px;
  transition:border-color .2s;
}
.cart-item:hover{border-color:var(--border-h)}
.cart-item-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}
.cart-item-name{
  font-size:13px;font-weight:600;
  color:var(--text);
  flex:1;
}
.cart-item-remove{
  background:none;border:none;
  color:var(--muted2);cursor:pointer;
  font-size:16px;padding:2px 4px;
  border-radius:4px;line-height:1;
  transition:.15s;flex-shrink:0;
}
.cart-item-remove:hover{color:var(--red);background:var(--red-bg)}
.cart-item-details{
  font-size:11px;color:var(--muted);
  margin-top:4px;
  display:flex;
  flex-wrap:wrap;
  gap:4px 10px;
}
.cart-item-details span{display:inline-flex;align-items:center;gap:4px}
.cart-item-details .transfer-badge{
  color:var(--accent);
  background:var(--accent-dim);
  padding:1px 8px;
  border-radius:99px;
  font-size:10px;
}
.cart-item-price{
  font-size:14px;font-weight:700;
  color:var(--accent);
  margin-top:6px;
}
.cart-item-price .breakdown{
  font-size:11px;font-weight:400;
  color:var(--muted);
  display:block;
}
.cart-item-price .usd{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px}

.sidebar-footer{
  flex-shrink:0;
  border-top:1px solid var(--border);
  padding-top:14px;
}
.commission-row{
  display:flex;align-items:center;gap:10px;
  margin-bottom:8px;
  flex-wrap:wrap;
}
.commission-row label{
  font-size:12px;color:var(--muted);
  white-space:nowrap;
}
.commission-row input{
  width:80px;
  padding:6px 10px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:6px;
  font-family:'DM Sans',sans-serif;
  font-size:13px;color:var(--text);
  outline:none;
}
.commission-row input:focus{border-color:var(--accent)}
.usd-rate-row{
  display:flex;align-items:center;gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.usd-rate-row label{
  font-size:12px;color:var(--muted);
  white-space:nowrap;
}
.usd-rate-row input{
  width:100px;
  padding:6px 10px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:6px;
  font-family:'DM Sans',sans-serif;
  font-size:13px;color:var(--text);
  outline:none;
}
.usd-rate-row input:focus{border-color:var(--accent)}
.usd-rate-row .hint{
  font-size:11px;color:var(--muted2);
}
.sidebar-total{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0 4px;
}
.sidebar-total .label{font-size:13px;color:var(--muted)}
.sidebar-total .amount{
  font-size:20px;font-weight:800;
  color:var(--text);
}
.sidebar-total .amount .usd{
  font-size:13px;color:var(--muted);font-weight:400;margin-left:6px;
}
.sidebar-actions{
  display:flex;gap:8px;margin-top:10px;
}
.sidebar-actions .btn{
  flex:1;justify-content:center;
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 16px;border-radius:8px;
  font-family:'DM Sans',sans-serif;
  font-size:13px;font-weight:600;
  cursor:pointer;border:none;
  transition:background .15s,box-shadow .15s,transform .1s;
}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:var(--accent);color:#0a0a0f;font-weight:700;
}
.btn-primary:hover{background:#f0d060;box-shadow:0 4px 16px var(--accent-glow)}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-ghost{
  background:transparent;color:var(--muted);
  border:1px solid var(--border);
}
.btn-ghost:hover{color:var(--text);border-color:var(--border-h);background:var(--surface2)}
.btn-danger-ghost{
  background:transparent;color:var(--muted);
  border:1px solid var(--muted2);
}
.btn-danger-ghost:hover{color:var(--red);border-color:var(--red);background:var(--red-bg)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}

/* ══════════════════════════════════════════════════════════════
   SEARCH
══════════════════════════════════════════════════════════════ */
.search-section{
  margin-bottom:16px;
}
.search-bar{
  display:flex;gap:12px;align-items:center;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:4px 16px 4px 20px;
  transition:border-color .2s,box-shadow .2s;
}
.search-bar:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-dim);
}
.search-bar input{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  font-family:'DM Sans',sans-serif;
  font-size:15px;
  color:var(--text);
  padding:12px 0;
}
.search-bar input::placeholder{color:var(--muted2)}
.search-bar .btn{
  flex-shrink:0;
  padding:8px 20px;
}
.search-hint{
  font-size:12px;color:var(--muted2);
  margin-top:6px;
  padding-left:4px;
}

/* ══════════════════════════════════════════════════════════════
   RESULTS
══════════════════════════════════════════════════════════════ */
.results-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;
}
.results-header .count{
  font-size:13px;color:var(--muted);
}
.results-header .clear-btn{
  font-size:12px;color:var(--muted2);
  background:none;border:none;cursor:pointer;
  transition:color .2s;
}
.results-header .clear-btn:hover{color:var(--text)}

@keyframes cardIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}

.result-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:10px;
  padding:16px 20px;
  cursor:pointer;
  transition:border-color .2s,box-shadow .2s,background .2s;
  animation:cardIn .3s ease both;
  user-select:none;
}
.result-card:hover{
  border-color:var(--border-h);
  background:var(--surface2);
}
.result-card.selected{
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent-dim),0 4px 20px rgba(0,0,0,.2);
}
.result-card .badge{
  font-size:10px;font-weight:600;
  padding:1px 8px;border-radius:4px;
  background:var(--surface3);
  color:var(--muted);
  border:1px solid var(--border);
}
.result-card .badge-dest{
  background:var(--accent-dim);
  color:var(--accent);
  border-color:rgba(232,197,71,0.2);
}
.result-card .badge-supplier{
  background:rgba(255,255,255,0.05);
  border-color:rgba(255,255,255,0.1);
  color:var(--muted);
}
.result-card .badge-package{
  background:rgba(52,211,153,0.08);
  color:var(--green);
  border-color:var(--green-border);
}

.result-card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  pointer-events:auto;
  cursor:pointer;
}
.result-card-name{
  font-size:15px;font-weight:600;color:var(--text);
}
.result-card-meta{
  font-size:12px;color:var(--muted);
  margin-top:4px;
  display:flex;flex-wrap:wrap;gap:4px 12px;
}
.result-card-package{
  font-size:11px;color:var(--muted2);
  margin-top:2px;
}
.result-card-price-preview{
  font-size:13px;color:var(--muted2);
  white-space:nowrap;
  flex-shrink:0;
  padding-top:2px;
  text-align:right;
}
.result-card-price-preview .from{font-size:11px;color:var(--muted2)}
.result-card-price-preview strong{color:var(--accent);font-size:15px}

/* ── Attraction detail (expanded) ───────────────────────────── */
.attraction-detail{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--border);
  display:none;
  pointer-events:auto;
}
.result-card.selected .attraction-detail{display:block}

.detail-section{margin-bottom:14px}
.detail-section-title{
  font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted2);
  margin-bottom:8px;
}
.detail-rate-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:8px;
}
.rate-option{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px 12px;
  text-align:left;
  user-select:none;
  cursor:default;
  opacity:0.85;
}
.rate-option .label{
  font-size:13px;
  font-weight:600;
  color:var(--text);
}
.rate-option .price{
  font-size:14px;
  font-weight:700;
  color:var(--accent);
  margin-top:4px;
}
.rate-option .price .per{font-size:11px;font-weight:400;color:var(--muted)}
.rate-option .pax-info{font-size:11px;color:var(--muted);margin-top:2px}

/* ── Yona Beach special style - fixed package ──────────────────── */
.yona-package-info{
  background:var(--accent-dim);
  border:1px solid rgba(232,197,71,0.2);
  border-radius:8px;
  padding:12px 16px;
  margin-bottom:12px;
}
.yona-package-info .label{
  font-size:12px;
  color:var(--muted);
}
.yona-package-info .price{
  font-size:20px;
  font-weight:800;
  color:var(--accent);
  margin-top:4px;
}
.yona-package-info .note{
  font-size:11px;
  color:var(--muted2);
  margin-top:4px;
}

/* ── Pax section (hidden for Yona) ───────────────────────────── */
.detail-pax{
  display:flex;gap:12px;flex-wrap:wrap;
  background:var(--surface2);border-radius:8px;padding:10px 14px;
}
.detail-pax.hidden{
  display:none;
}
.detail-pax .pax-group{
  display:flex;align-items:center;gap:6px;
}
.detail-pax .pax-group label{
  font-size:12px;color:var(--muted);
}
.detail-pax .pax-group input{
  width:44px;padding:4px 6px;
  background:var(--surface3);border:1px solid var(--border);
  border-radius:4px;color:var(--text);text-align:center;
  font-size:13px;font-family:'DM Sans',sans-serif;
}
.detail-pax .pax-group input:focus{border-color:var(--accent);outline:none}
.detail-pax .pax-total{
  font-size:12px;color:var(--muted2);
  margin-left:auto;display:flex;align-items:center;
}

/* ── Transfer Select ───────────────────────────────────────────── */
.detail-transfer-select{
  margin-top:10px;
  position:relative;
}
.detail-transfer-select .transfer-input-wrap{
  position:relative;
}
.detail-transfer-select input{
  width:100%;
  padding:8px 32px 8px 12px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.detail-transfer-select input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-dim);
}
.detail-transfer-select input::placeholder{
  color:var(--muted2);
}
.detail-transfer-select .dropdown-arrow{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  pointer-events:none;
  color:var(--muted2);
  font-size:10px;
}
.detail-transfer-select .transfer-dropdown{
  position:absolute;
  top:calc(100% + 4px);
  left:0;
  right:0;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:6px;
  max-height:200px;
  overflow-y:auto;
  display:none;
  z-index:40;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.detail-transfer-select .transfer-dropdown.open{

<!-- ═══════════════════════════════════════════════════════════════════════════
     JAVASCRIPT
═══════════════════════════════════════════════════════════════════════════ -->
<script>
// ── STATE ─────────────────────────────────────────────────────────────────────
let cart         = [];
let selectedAttraction = null;
let allResults   = [];
let searchTimeout = null;
let searchQuery  = '';
let allTransfers = [];  // Cache for ALL transfers

// ── Filter Data ──────────────────────────────────────────────────────────────
// Only city and supplier filters (removed package)
const filterData = {
  city: {
    options: {{ cities|tojson }},
    input: null,
    value: ''
  },
  supplier: {
    options: {{ suppliers|tojson }},
    input: null,
    value: ''
  }
};

// ── Yona Beach supplier check ──────────────────────────────────────────────
function isYonaBeach(attr) {
  if (!attr) return false;
  const supplier = (attr.supplier || '').toLowerCase();
  const name = (attr.attraction_name || '').toLowerCase();
  return supplier.includes('yona') || name.includes('yona beach');
}

// ── AUTH-AWARE FETCH ──────────────────────────────────────────────────────────
async function apiFetch(url) {
  const r = await fetch(url);
  if (r.status === 401) { 
    window.location.href = '/login'; 
    return null; 
  }
  return r;
}

// ── FILTER DROPDOWN FUNCTIONS ──────────────────────────────────────────────
function initFilterDropdowns() {
  for (const [key, data] of Object.entries(filterData)) {
    data.input = document.getElementById(`filter-${key}-input`);
    const dropdown = document.getElementById(`${key}-dropdown`);
    if (data.input) {
      data.input.dataset.filterKey = key;
      data.input.value = '';
      renderFilterOptions(key, '');
    }
  }
}

function filterDropdown(key, value) {
  renderFilterOptions(key, value);
  const dropdown = document.getElementById(`${key}-dropdown`);
  if (dropdown) dropdown.classList.add('open');
}

function closeDropdown(key) {
  const dropdown = document.getElementById(`${key}-dropdown`);
  if (dropdown) dropdown.classList.remove('open');
}

function renderFilterOptions(key, search) {
  const data = filterData[key];
  const dropdown = document.getElementById(`${key}-dropdown`);
  if (!dropdown) return;
  
  const searchLower = search.toLowerCase().trim();
  let filtered = data.options;
  
  if (searchLower) {
    filtered = data.options.filter(opt => opt.toLowerCase().includes(searchLower));
  }
  
  if (filtered.length === 0) {
    dropdown.innerHTML = `<div class="option empty">No matches found</div>`;
    return;
  }
  
  dropdown.innerHTML = filtered.map(opt => `
    <div class="option" onclick="selectFilterOption('${key}', '${escHtml(opt)}')">
      ${escHtml(opt)}
    </div>
  `).join('');
}

function selectFilterOption(key, value) {
  const data = filterData[key];
  if (data.input) {
    data.input.value = value;
    data.value = value;
  }
  closeDropdown(key);
  applyFilters();
}

function getFilterValue(key) {
  const data = filterData[key];
  return data.value || '';
}

// ── FILTERS APPLICATION ──────────────────────────────────────────────────────
function applyFilters() {
  updateActiveFilters();
  if (searchQuery && searchQuery.length > 0) {
    doSearch();
  } else {
    doSearch();
  }
}

function updateActiveFilters() {
  const container = document.getElementById('active-filters');
  const city = getFilterValue('city');
  const supplier = getFilterValue('supplier');
  
  let filters = [];
  if (city) filters.push({ label: `City: ${city}`, key: 'city', value: city });
  if (supplier) filters.push({ label: `Supplier: ${supplier}`, key: 'supplier', value: supplier });
  
  const btn = document.getElementById('clear-filters-btn');
  if (filters.length === 0) {
    container.innerHTML = '';
    btn.classList.remove('has-filters');
    return;
  }
  btn.classList.add('has-filters');
  container.innerHTML = filters.map(f => `
    <span class="filter-pill">
      ${f.label}
      <span class="remove" onclick="removeFilter('${f.key}')">×</span>
    </span>
  `).join('');
}

function removeFilter(key) {
  const data = filterData[key];
  if (data && data.input) {
    data.input.value = '';
    data.value = '';
  }
  applyFilters();
}

function clearAllFilters() {
  for (const [key, data] of Object.entries(filterData)) {
    if (data.input) {
      data.input.value = '';
      data.value = '';
    }
  }
  updateActiveFilters();
  if (searchQuery && searchQuery.length > 0) doSearch();
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
function handleSearchInput() {
  clearTimeout(searchTimeout);
  const q = document.getElementById('search-input').value.trim();
  searchQuery = q;
  
  const hint = document.getElementById('search-hint');
  if (q.length === 0) {
    const hasFilters = getFilterValue('city') || getFilterValue('supplier');
    if (hasFilters) {
      searchTimeout = setTimeout(() => doSearch(), 100);
    }
    hint.textContent = 'Fuzzy search — try partial matches like "yona", "beach", "coral world"';
    return;
  }
  hint.textContent = 'Searching…';
  searchTimeout = setTimeout(() => doSearch(), 300);
}

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  const city = getFilterValue('city');
  const supplier = getFilterValue('supplier');
  
  searchQuery = q;
  const spinner = document.getElementById('search-spinner');
  spinner.style.display = 'inline-block';
  const list = document.getElementById('results-list');
  list.innerHTML = `<div class="empty-state"><span class="spinner" style="margin-right:0;display:inline-block;width:24px;height:24px;border-width:3px"></span><br>Searching attractions…</div>`;

  const params = new URLSearchParams();
  if (q) params.append('q', q);
  if (city) params.append('city', city);
  if (supplier) params.append('supplier', supplier);
  params.append('limit', '200');

  const url = `/quotation-attractions/api/search?${params.toString()}`;
  
  const r = await apiFetch(url);
  spinner.style.display = 'none';
  if (!r) return;
  
  try {
    const data = await r.json();
    if (data.error) {
      list.innerHTML = `<div class="empty-state">Error: ${data.error}</div>`;
      return;
    }
    allResults = data;
    for (const attr of allResults) {
      attr._pax = { adults: 0, children: 0, seniors: 0 };
      attr._selectedTransfer = null;
      attr._selectedTransferPrice = null;
      attr._selectedTransferName = null;
      attr._inCart = false;
      // For Yona Beach, set default count to 1
      if (isYonaBeach(attr)) {
        attr._pax.adults = 1;
        attr._pax.total_pax = 1;
      }
    }
    selectedAttraction = null;

    document.getElementById('result-count').textContent = `${data.length} attraction${data.length > 1 ? 's' : ''}`;
    document.getElementById('clear-btn').style.display = data.length ? 'inline' : 'none';

    if (!data.length) {
      list.innerHTML = `<div class="empty-state">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        No attractions found
        <div class="sub">Try adjusting your search or filters</div>
      </div>`;
      return;
    }

    // Load all transfers once
    await loadAllTransfers();

    list.innerHTML = data.map((attr, i) => renderAttractionCard(attr, i)).join('');
  } catch (e) {
    console.error('Search error:', e);
    list.innerHTML = `<div class="empty-state">Error processing search results</div>`;
  }
}

function clearResults() {
  document.getElementById('search-input').value = '';
  searchQuery = '';
  document.getElementById('results-list').innerHTML = '';
  document.getElementById('result-count').textContent = '';
  document.getElementById('clear-btn').style.display = 'none';
  document.getElementById('search-hint').textContent = 'Fuzzy search — try partial matches like "yona", "beach", "coral world"';
  allResults = [];
  selectedAttraction = null;
}

// ── LOAD ALL TRANSFERS ──────────────────────────────────────────────────────
async function loadAllTransfers() {
  if (allTransfers.length > 0) return;
  
  try {
    const r = await apiFetch('/quotation-attractions/api/transfers?city=all');
    if (!r) return;
    const data = await r.json();
    allTransfers = data || [];
    console.log(`Loaded ${allTransfers.length} total transfers`);
  } catch (e) {
    console.error('Error loading transfers:', e);
  }
}

// ── RENDER FUNCTIONS ──────────────────────────────────────────────────────────
function renderAttractionCard(attr, idx) {
  const isSelected = selectedAttraction === attr.id;
  const isInCart = attr._inCart || false;
  const isYona = isYonaBeach(attr);
  
  const adults = attr._pax.adults || 0;
  const children = attr._pax.children || 0;
  const seniors = attr._pax.seniors || 0;
  
  let attractionTotal = 0;
  
  if (isYona) {
    // Yona Beach: Use adult_net_price as fixed package price
    attractionTotal = attr.adult_net_price || 0;
  } else {
    // Normal: Calculate based on pax
    if (attr.adult_net_price) attractionTotal += attr.adult_net_price * adults;
    if (attr.child_net_price) attractionTotal += attr.child_net_price * children;
    if (attr.senior_price) attractionTotal += attr.senior_price * seniors;
  }
  
  const transferPrice = attr._selectedTransferPrice || 0;
  const totalPrice = attractionTotal + transferPrice;
  
  let breakdownParts = [];
  if (isYona) {
    breakdownParts.push(`Fixed Package: ฿${attr.adult_net_price ? attr.adult_net_price.toLocaleString() : '0'}`);
  } else {
    if (adults > 0 && attr.adult_net_price) {
      breakdownParts.push(`${adults} Adult × ฿${attr.adult_net_price.toLocaleString()}`);
    }
    if (children > 0 && attr.child_net_price) {
      breakdownParts.push(`${children} Child × ฿${attr.child_net_price.toLocaleString()}`);
    }
    if (seniors > 0 && attr.senior_price) {
      breakdownParts.push(`${seniors} Senior × ฿${attr.senior_price.toLocaleString()}`);
    }
  }
  if (transferPrice > 0) {
    breakdownParts.push(`Transfer +฿${transferPrice.toLocaleString()}`);
  }
  const breakdownStr = breakdownParts.length > 0 ? breakdownParts.join(' + ') : 'No guests selected';

  // Yona-specific package info HTML
  const yonaPackageHTML = isYona ? `
    <div class="yona-package-info">
      <div class="label">📦 Fixed Package (per person)</div>
      <div class="price">฿${attr.adult_net_price ? attr.adult_net_price.toLocaleString() : '0'}</div>
      <div class="note">This attraction has a fixed package price. No per-person selection needed.</div>
    </div>
  ` : '';

  // Pax section - hidden for Yona
  const paxHTML = isYona ? '' : `
    <div class="detail-section">
      <div class="detail-section-title">👥 Number of Guests</div>
      <div class="detail-pax">
        <div class="pax-group">
          <label>Adults</label>
          <input type="number" id="adults-${attr.id}" value="${attr._pax.adults || 0}" min="0" max="20"
                 onchange="updatePax(${attr.id}, 'adults', this.value)">
        </div>
        <div class="pax-group">
          <label>Children</label>
          <input type="number" id="children-${attr.id}" value="${attr._pax.children || 0}" min="0" max="20"
                 onchange="updatePax(${attr.id}, 'children', this.value)">
        </div>
        <div class="pax-group">
          <label>Seniors</label>

        </div>

    (totalPrice > 0 ? `Total: ฿${totalPrice.toLocaleString()} for ${adults + children + seniors} guest${(adults + children + seniors) !== 1 ? 's' : ''}` : 'Add guests to see total');

  return `
<div class="result-card ${isSelected ? 'selected' : ''}" 
     style="animation-delay:${Math.min(idx * 50, 400)}ms"

  <div class="result-card-top" onclick="toggleAttraction(${attr.id})">
    <div>

      <div class="result-card-meta">
        <span class="badge badge-dest">${escHtml(attr.city)}</span>

        ${attr.package_group ? `<span class="badge">${escHtml(attr.package_group)}</span>` : ''}
      </div>
      ${attr.package_label ? `<div class="result-card-package">📦 ${escHtml(attr.package_label)}</div>` : ''}

    <!-- Transfer Selection with Searchable Dropdown -->

      <div class="detail-section-title">🚗 Transfer (optional)</div>

        <input type="text" id="transfer-input-${attr.id}" 
               placeholder="Search transfer…"

      ${isInCart ? '✓ Added to Cart' : 'Add to Cart'}

// ── TRANSFER DROPDOWN FUNCTIONS ─────────────────────────────────────────────
function filterTransferOptions(attrId, search) {
  const attr = allResults.find(a => a.id === attrId);
  if (!attr) return;
  
  const dropdown = document.getElementById(`transfer-dropdown-${attrId}`);
  if (!dropdown) return;
  
  // Show ALL transfers
  let filtered = allTransfers;
  
  const searchLower = search.toLowerCase().trim();
  
  if (searchLower) {
    filtered = filtered.filter(t => 
      (t.name && t.name.toLowerCase().includes(searchLower)) || 
      (t.service_type && t.service_type.toLowerCase().includes(searchLower)) ||
      (t.destination && t.destination.toLowerCase().includes(searchLower))
    );
  }
  
  if (filtered.length === 0) {
    dropdown.innerHTML = `<div class="option empty">No transfer options found</div>`;
    dropdown.classList.add('open');
    return;
  }
  
  dropdown.innerHTML = filtered.map(t => {
    let price = null;
    for (const r of t.rates || []) {
      if (r.pax_category === 'PerVehicle') {
        price = r.price_thb;
        break;
      }
    }
    if (price === null) {
      for (const r of t.rates || []) {
        if (r.pax_category === 'Adult') {
          price = r.price_thb;
          break;
        }
      }
    }
    const priceStr = price ? `฿${price.toLocaleString()}` : 'No price';
    const typeDisplay = t.service_type || 'Transfer';
    const destDisplay = t.destination ? `📍${t.destination}` : '';
    return `
      <div class="option" onclick="selectTransferOption(${attrId}, ${t.id}, '${escHtml(t.name || 'Transfer')}', ${price || 0})">
        ${escHtml(t.name || 'Transfer')}
        <span class="opt-type">${escHtml(typeDisplay)} ${destDisplay}</span>
        <span class="opt-price">${priceStr}</span>
      </div>
    `;
  }).join('');
  
  dropdown.classList.add('open');
}

function closeTransferDropdown(attrId) {
  const dropdown = document.getElementById(`transfer-dropdown-${attrId}`);
  if (dropdown) dropdown.classList.remove('open');
}

function selectTransferOption(attrId, transferId, transferName, price) {
  const attr = allResults.find(a => a.id === attrId);
  if (!attr) return;
  
  attr._selectedTransfer = transferId;
  attr._selectedTransferPrice = price;
  attr._selectedTransferName = transferName;
  
  const input = document.getElementById(`transfer-input-${attrId}`);
  if (input) {
    input.value = transferName;
  }
  
  const priceEl = document.getElementById(`transfer-price-${attrId}`);
  if (priceEl) {
    priceEl.textContent = price > 0 ? `+ ฿${price.toLocaleString()} for transfer: ${transferName}` : '';
  }
  
  closeTransferDropdown(attrId);
  
  // Re-render to update total
  const idx = allResults.indexOf(attr);
  const newCard = renderAttractionCard(attr, idx);
  const card = document.querySelector(`.result-card[data-attraction-id="${attrId}"]`);
  if (card) {
    card.outerHTML = newCard;
    const newCardEl = document.querySelector(`.result-card[data-attraction-id="${attrId}"]`);
    if (newCardEl) {
      newCardEl.querySelector('.result-card-top').onclick = () => toggleAttraction(attrId);
      if (selectedAttraction === attrId) {
        newCardEl.classList.add('selected');
        populateTransferDropdown(attrId);
      }
    }
  }
}

function populateTransferDropdown(attrId) {
  const attr = allResults.find(a => a.id === attrId);
  if (!attr) return;
  
  const dropdown = document.getElementById(`transfer-dropdown-${attrId}`);
  const hint = document.getElementById(`transfer-hint-${attrId}`);
  
  if (!dropdown) return;
  
  // Show ALL transfers
  let filtered = allTransfers;
  
  if (hint) {
    hint.textContent = filtered.length > 0 ? 
      `${filtered.length} transfer option(s) available (all service types)` : 
      'No transfer options available';
  }
  
  if (filtered.length === 0) {
    dropdown.innerHTML = `<div class="option empty">No transfer options available</div>`;
    return;
  }
  
  dropdown.innerHTML = filtered.map(t => {
    let price = null;
    for (const r of t.rates || []) {
      if (r.pax_category === 'PerVehicle') {
        price = r.price_thb;
        break;
      }
    }
    if (price === null) {
      for (const r of t.rates || []) {
        if (r.pax_category === 'Adult') {
          price = r.price_thb;
          break;
        }
      }
    }
    const priceStr = price ? `฿${price.toLocaleString()}` : 'No price';
    const typeDisplay = t.service_type || 'Transfer';
    const destDisplay = t.destination ? `📍${t.destination}` : '';
    return `
      <div class="option" onclick="selectTransferOption(${attrId}, ${t.id}, '${escHtml(t.name || 'Transfer')}', ${price || 0})">
        ${escHtml(t.name || 'Transfer')}
        <span class="opt-type">${escHtml(typeDisplay)} ${destDisplay}</span>
        <span class="opt-price">${priceStr}</span>
      </div>
    `;
  }).join('');
  
  // Restore selected transfer if any
  if (attr && attr._selectedTransferName) {
    const input = document.getElementById(`transfer-input-${attrId}`);
    if (input) input.value = attr._selectedTransferName;
  }
}

// ── ATTRACTION INTERACTION ────────────────────────────────────────────────────
function toggleAttraction(id) {
  if (selectedAttraction === id) {
    selectedAttraction = null;
    const card = document.querySelector(`.result-card[data-attraction-id="${id}"]`);
    if (card) card.classList.remove('selected');
    return;
  }
  document.querySelectorAll('.result-card.selected').forEach(el => el.classList.remove('selected'));
  selectedAttraction = id;
  const card = document.querySelector(`.result-card[data-attraction-id="${id}"]`);
  if (card) {
    card.classList.add('selected');
    populateTransferDropdown(id);
  }
}

function updatePax(attrId, type, value) {
  const attr = allResults.find(a => a.id === attrId);
  if (!attr) return;
  // Don't update pax for Yona Beach
  if (isYonaBeach(attr)) return;
  
  const num = parseInt(value) || 0;
  attr._pax[type] = num;
  
  const idx = allResults.indexOf(attr);
  const newCard = renderAttractionCard(attr, idx);
  const card = document.querySelector(`.result-card[data-attraction-id="${attrId}"]`);
  if (card) {
    card.outerHTML = newCard;
    const newCardEl = document.querySelector(`.result-card[data-attraction-id="${attrId}"]`);
    if (newCardEl) {
      newCardEl.querySelector('.result-card-top').onclick = () => toggleAttraction(attrId);
      if (selectedAttraction === attrId) {
        newCardEl.classList.add('selected');
        populateTransferDropdown(attrId);
        if (attr._selectedTransferName) {
          const input = document.getElementById(`transfer-input-${attrId}`);
          if (input) input.value = attr._selectedTransferName;
        }
      }
    }
  }
}

// ── ADD TO CART ──────────────────────────────────────────────────────────────
function addToCart(attrId) {
  const attr = allResults.find(a => a.id === attrId);
  if (!attr) return;
  
  const isYona = isYonaBeach(attr);
  
  let adults = 0, children = 0, seniors = 0;
  let attractionTotal = 0;
  
  if (isYona) {
    // Yona Beach: Fixed package, no pax selection
    adults = 1;
    attractionTotal = attr.adult_net_price || 0;
  } else {
    adults = attr._pax.adults || 0;
    children = attr._pax.children || 0;
    seniors = attr._pax.seniors || 0;
    
    if (attr.adult_net_price) attractionTotal += attr.adult_net_price * adults;
    if (attr.child_net_price) attractionTotal += attr.child_net_price * children;
    if (attr.senior_price) attractionTotal += attr.senior_price * seniors;
  }
  
  const totalPax = isYona ? 1 : (adults + children + seniors);
  
  if (totalPax === 0 && !isYona) {
    alert('Please add at least one guest.');
    return;
  }
  
  const transferPrice = attr._selectedTransferPrice || 0;
  const transferName = attr._selectedTransferName || null;
  const totalPrice = attractionTotal + transferPrice;
  
  if (totalPrice === 0) {
    alert('No valid pricing available for this selection.');
    return;
  }

  const cartItem = {
    id: Date.now() + Math.random(),
    attraction_id: attr.id,
    name: attr.attraction_name,
    city: attr.city,
    supplier: attr.supplier,
    package_group: attr.package_group,
    isYona: isYona,
    adults: adults,
    children: children,
    seniors: seniors,
    total_pax: totalPax,
    attractionPrice: attractionTotal,
    transferPrice: transferPrice,
    transferName: transferName,
    transferId: attr._selectedTransfer,
    totalPrice: totalPrice,
  };

  const existingIdx = cart.findIndex(c => c.attraction_id === attr.id);
  if (existingIdx >= 0) {
    cart[existingIdx] = cartItem;
  } else {
    cart.push(cartItem);
  }
  
  attr._inCart = true;
  renderCart();
  updateCartTotals();
  
  const btn = document.getElementById(`add-btn-${attrId}`);
  if (btn) {
    btn.textContent = '✓ Added!';
    btn.classList.add('added');
    setTimeout(() => {
      btn.textContent = 'Add to Cart';
      btn.classList.remove('added');
    }, 1500);
  }
}

// ── CART ──────────────────────────────────────────────────────────────────────
function renderCart() {
  const container = document.getElementById('cart-items');
  const count = document.getElementById('cart-count');

  if (!cart.length) {
    container.innerHTML = `
      <div style="text-align:center;color:var(--muted2);font-size:13px;padding:40px 0;">
        No attractions added yet.<br>
        Search and click <strong>Add to Cart</strong>.
      </div>`;
    count.textContent = '0 items';
    document.getElementById('generate-btn').disabled = true;
    return;
  }

  count.textContent = `${cart.length} item${cart.length > 1 ? 's' : ''}`;
  document.getElementById('generate-btn').disabled = false;

  container.innerHTML = cart.map((item, idx) => {
    const usd = thbToUsd(item.totalPrice);
    const transferDisplay = item.transferName ? 
      `<span class="transfer-badge">🚗 ${escHtml(item.transferName)}</span>` : '';
    const paxDisplay = item.isYona ? 'Fixed Package' : `${item.total_pax} pax`;
    
    return `
    <div class="cart-item">
      <div class="cart-item-top">
        <div class="cart-item-name">${escHtml(item.name)}${item.isYona ? ' 📦' : ''}</div>
        <button class="cart-item-remove" onclick="removeFromCart(${idx})" title="Remove">✕</button>
      </div>
      <div class="cart-item-details">
        <span>${escHtml(item.city)}</span>
        <span>${paxDisplay}</span>
        ${transferDisplay}
        ${item.isYona ? `<span class="transfer-badge" style="background:var(--green-bg);color:var(--green);border-color:var(--green-border)">Fixed Package</span>` : ''}
      </div>
      <div class="cart-item-price">
        ฿${item.totalPrice.toLocaleString()}
        ${usd ? `<span class="usd">≈ $${usd}</span>` : ''}
        <span class="breakdown">
          ${item.isYona ? `Package: ฿${item.attractionPrice.toLocaleString()}` : `Ticket: ฿${item.attractionPrice.toLocaleString()}`}
          ${item.transferPrice > 0 ? `+ Transfer: ฿${item.transferPrice.toLocaleString()}` : ''}
        </span>
      </div>
    </div>`;
  }).join('');
}

function removeFromCart(idx) {
  const item = cart[idx];
  if (item) {
    const attr = allResults.find(a => a.id === item.attraction_id);
    if (attr) attr._inCart = false;
  }
  cart.splice(idx, 1);
  renderCart();
  updateCartTotals();
  
  for (const attr of allResults) {
    const btn = document.getElementById(`add-btn-${attr.id}`);
    if (btn) {
      const inCart = cart.some(c => c.attraction_id === attr.id);
      attr._inCart = inCart;
      btn.textContent = inCart ? '✓ Added to Cart' : 'Add to Cart';
      if (inCart) btn.classList.add('added');
      else btn.classList.remove('added');
    }
  }
}

function clearCart() {
  for (const attr of allResults) {
    attr._inCart = false;
  }
  cart = [];
  renderCart();
  updateCartTotals();
  
  for (const attr of allResults) {
    const btn = document.getElementById(`add-btn-${attr.id}`);
    if (btn) {
      btn.textContent = 'Add to Cart';
      btn.classList.remove('added');
    }
  }
}

function getUsdRate() {
  return parseFloat(document.getElementById('usd-rate-input').value) || 34.00;
}

function thbToUsd(thb) {
  const rate = getUsdRate();
  return (rate && thb) ? (thb / rate).toFixed(2) : null;
}

function updateCartTotals() {
  const comm = parseFloat(document.getElementById('commission-input').value) || 100;
  const subtotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
  const commissionAmount = subtotal / (comm / 100);
  const total =  Math.round(commissionAmount);

  const usd = thbToUsd(total);
  document.getElementById('cart-total').innerHTML = `
    ฿${total.toLocaleString()}
    ${usd ? `<span class="usd">≈ $${usd}</span>` : ''}
  `;
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function showModal() {
  if (!cart.length) return;
  renderQuotationText();
  document.getElementById('quotation-modal').classList.add('visible');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('quotation-modal').classList.remove('visible');
  document.body.style.overflow = '';
}

function buildQuotationText() {
  const today = new Date().toLocaleDateString('en-GB', {
    day:'2-digit', month:'short', year:'numeric', timeZone:'Asia/Bangkok'
  });
  const comm = parseFloat(document.getElementById('commission-input').value) || 100;
  const usdRate = getUsdRate();
  const subtotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
  const commissionAmount = subtotal / (comm / 100);
  const grandTotal =  Math.round(commissionAmount);

  const div = '─'.repeat(30);

  const lines = [
    `*Vayo Aura — Quotation*`,
    `Date: ${today}`,
    `USD Rate: 1 USD = ฿${usdRate.toFixed(2)}`,
    div, '',
  ];

  cart.forEach((item, i) => {
    const itemUsd = thbToUsd(item.totalPrice);
    lines.push(`*${i+1}. ${item.name}${item.isYona ? ' (Fixed Package)' : ''}*`);
    lines.push(`   ${item.city} · ${item.isYona ? 'Fixed Package' : `${item.total_pax} pax`}`);
    if (!item.isYona) {
      lines.push(`   ${item.adults} Adults, ${item.children} Children, ${item.seniors} Seniors`);
    }
    lines.push(`   ${item.isYona ? 'Package' : 'Ticket'}: ฿${item.attractionPrice.toLocaleString()}`);
    if (item.transferPrice > 0 && item.transferName) {
      lines.push(`   Transfer: ${item.transferName} — ฿${item.transferPrice.toLocaleString()}`);
    } else if (item.transferPrice > 0) {
      lines.push(`   Transfer: ฿${item.transferPrice.toLocaleString()}`);
    }
    lines.push(`   Subtotal: ฿${item.totalPrice.toLocaleString()}`);
    if (itemUsd) lines.push(`   ≈ $${itemUsd} USD`);
    lines.push('');
  });

  const grandUsd = thbToUsd(grandTotal);
  lines.push(div);
  lines.push(`*GRAND TOTAL: ฿${grandTotal.toLocaleString()}*`);
  if (grandUsd) lines.push(`*≈ $${grandUsd} USD*`);
  lines.push(div);
  lines.push('');
  return lines.join('\n');
}

function renderQuotationText() {
  document.getElementById('quotation-text').textContent = buildQuotationText();
}

async function copyQuotation() {
  const text = document.getElementById('quotation-text').textContent;
  const btn = document.getElementById('copy-btn');
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = Object.assign(document.createElement('textarea'), {
      value:text, style:'position:fixed;opacity:0'
    });
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
  }
  btn.textContent = '✓ Copied!';
  setTimeout(() => btn.textContent = 'Copy to Clipboard', 2200);
}

// ── EXCEL EXPORT ──────────────────────────────────────────────────────────────
function exportToExcel() {
  if (!cart.length) return;

  const today = new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric', timeZone:'Asia/Bangkok' });
  const fileDate = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' });
  const comm = parseFloat(document.getElementById('commission-input').value) || 100;
  const usdRate = getUsdRate();

  const subtotal = cart.reduce((s, it) => s + it.totalPrice, 0);
  const commissionAmount = subtotal / (comm / 100);
  const grandTotal =  Math.round(commissionAmount);

  const describe = (it) => {
    let d = it.name;
    d += ` (${it.city})`;
    if (it.isYona) {
      d += ' [Fixed Package]';
    } else {
      d += ` — ${it.adults}A/${it.children}C/${it.seniors}S`;
    }
    if (it.transferPrice > 0 && it.transferName) {
      d += ` + Transfer: ${it.transferName}`;
    } else if (it.transferPrice > 0) {
      d += ' + Transfer';
    }
    return d;
  };
  const usdVal = (thb) => { const u = parseFloat(thbToUsd(thb)); return isFinite(u) ? u : ''; };

  const aoa = [
    ['Vayo Aura — Attraction Quotation'],
    ['Date', today],
    [],
    ['Attraction', 'Type', 'Pax', 'Transfer', 'Ticket/Package (THB)', 'Transfer (THB)', 'Total (THB)', 'Total (USD)'],
  ];
  cart.forEach((it) => aoa.push([
    it.name,
    it.isYona ? 'Fixed Package' : 'Per Person',
    it.isYona ? 'N/A' : `${it.adults}A/${it.children}C/${it.seniors}S`,
    it.transferName || 'None',
    it.attractionPrice,
    it.transferPrice || 0,
    it.totalPrice,
    usdVal(it.totalPrice)
  ]));
  aoa.push([]);
  aoa.push(['Subtotal', '', '', '', '', '', subtotal, usdVal(subtotal)]);
  if (comm > 0) aoa.push([`Commission (${comm}%)`, '', '', '', '', '', commissionAmount, '']);
  aoa.push(['GRAND TOTAL', '', '', '', '', '', grandTotal, usdVal(grandTotal)]);

  const filename = `VIKRAM_Attraction_Quotation_${fileDate}.xlsx`;
  const btn = document.getElementById('export-btn');

  if (typeof XLSX !== 'undefined') {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 30 }, { wch: 15 }, { wch: 12 }, { wch: 20 }, { wch: 16 }, { wch: 14 }, { wch: 14 }, { wch: 14 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Attraction Quotation');
    XLSX.writeFile(wb, filename);
  } else {
    exportCsvFallback(aoa, filename.replace(/\.xlsx$/, '.csv'));
  }

  if (btn) {
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ Exported!';
    setTimeout(() => { btn.innerHTML = orig; }, 2000);
  }
}

function exportCsvFallback(aoa, filename) {
  const esc = (v) => {
    const s = (v == null ? '' : String(v));
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const csv = '\uFEFF' + aoa.map(row => row.map(esc).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function escHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

  document.getElementById('total-badge').textContent = `${total} attractions`;
  initFilterDropdowns();
  loadAllTransfers();

});

document.getElementById('search-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { 
    e.preventDefault(); 
    doSearch(); 
  }
});

document.addEventListener('click', (e) => {
  const sidebar = document.getElementById('sidebar');
  if (window.innerWidth <= 820 && sidebar.classList.contains('open')) {
    if (!sidebar.contains(e.target) && !e.target.closest('.sidebar-handle')) {
      sidebar.classList.remove('open');
    }
  }
});

updateActiveFilters();
