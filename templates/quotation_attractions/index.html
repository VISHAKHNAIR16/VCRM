  white-space:pre-wrap;word-break:break-word;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:14px 16px;color:var(--text);
  max-height:350px;overflow-y:auto;
}

/* ══════════════════════════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════════════════════════ */
@media(max-width:820px){
  :root{--sidebar-width: 320px}
  .main-content{padding:16px 16px 24px;max-width:100%}
  .sidebar{
    position:fixed;bottom:0;left:0;right:0;top:auto;
    width:100%;height:50vh;
    border-left:none;border-top:1px solid var(--border);
    border-radius:16px 16px 0 0;
    transform:translateY(calc(100% - 60px));
    padding:12px 16px;
    background:rgba(17,17,24,0.98);
    backdrop-filter:blur(20px);
    z-index:100;
  }
  .sidebar.open{transform:translateY(0)}
  .sidebar-handle{
    display:block !important;
    width:40px;height:4px;
    background:var(--muted2);
    border-radius:99px;
    margin:0 auto 12px;
    cursor:pointer;
  }
  .sidebar-items{max-height:calc(50vh - 220px)}
  .detail-rate-grid{grid-template-columns:1fr 1fr}
  .filters-row{flex-direction:column;align-items:stretch}
  .filter-group{flex:1 1 auto}
  .filter-divider{display:none}
  .filter-clear-btn{align-self:flex-end}
  .attraction-search-inline{flex-wrap:wrap}
}

.sidebar-handle{display:none}

.service-detail::-webkit-scrollbar{width:4px}
.service-detail::-webkit-scrollbar-track{background:transparent}
.service-detail::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:99px}
</style>
</head>
<body>

<a href="#main-content" class="skip-link">Skip to search</a>
<div id="toast-stack" aria-live="polite" aria-atomic="true"></div>

<!-- ── HEADER ──────────────────────────────────────────────────────────────── -->
<header class="site-header">
  <a href="/home" class="header-back">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
      <path d="M10 4L6 8l4 4" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Home
  </a>
  <div class="header-sep"></div>
  <span class="header-title">🚐 Transfer Quotation</span>
  <span class="header-fx" id="fx-label">Loading rates…</span>
</header>

<!-- ── APP LAYOUT ───────────────────────────────────────────────────────────── -->
<div class="app-layout">

  <!-- ── MAIN CONTENT ──────────────────────────────────────────────────────── -->
  <div class="main-content" id="main-content">

    <!-- ── FILTERS ───────────────────────────────────────────────────────────── -->
    <div class="filters-section">
      <div class="filters-row">
        
        <!-- City Filter -->
        <div class="filter-group">
          <label>City</label>
          <select id="filter-city" onchange="applyFilters()">
            <option value="">All Cities</option>
            {% for city in cities %}
            <option value="{{ city }}">{{ city }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="filter-divider"></div>

        <!-- Supplier Filter -->
        <div class="filter-group">
          <label>Supplier</label>
          <select id="filter-supplier" onchange="applyFilters()">
            <option value="">All Suppliers</option>
            {% for supplier in suppliers %}
            <option value="{{ supplier }}">{{ supplier }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="filter-divider"></div>

        <!-- Service Type Filter -->
        <div class="filter-group">
          <label>Type</label>
          <select id="filter-type" onchange="applyFilters()">
            <option value="">All Types</option>
            {% for type in service_types %}
            <option value="{{ type }}">{{ type }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="filter-divider"></div>

        <!-- Clear Filters Button -->
        <button class="filter-clear-btn" id="clear-filters-btn" onclick="clearAllFilters()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/>
          </svg>
          Clear Filters
        </button>
      </div>

      <!-- Active Filters Display -->
      <div class="active-filters" id="active-filters"></div>
    </div>

    <!-- ── SEARCH ───────────────────────────────────────────────────────────── -->
    <div class="search-section">
      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted2)" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search-input" 
               placeholder="Search transfers (e.g. 'airport to hotel', 'phuket transfer')…"
               oninput="handleSearchInput()"
               autofocus>
        <button class="btn btn-primary" onclick="doSearch()">
          <span id="search-spinner" style="display:none" class="spinner"></span>
          Search
        </button>
      </div>
      <div class="search-hint" id="search-hint">Search for transfer services by name, destination, supplier, or type</div>
    </div>

    <!-- ── RESULTS ───────────────────────────────────────────────────────────── -->
    <div class="results-header">
      <span class="count" id="result-count"></span>
      <button class="clear-btn" onclick="clearResults()" id="clear-btn" style="display:none">Clear results</button>
    </div>
    <div id="results-list"></div>

  </div>

  <!-- ── SIDEBAR (Cart) ────────────────────────────────────────────────────── -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-handle" onclick="toggleSidebar()"></div>

    <div class="sidebar-header">
      <h2>🛒 Cart</h2>
      <span class="count" id="cart-count">0 items</span>
    </div>

    <div class="sidebar-items" id="cart-items">
      <div style="text-align:center;color:var(--muted2);font-size:13px;padding:40px 0;">
        No items added yet.<br>
        Search for transfers and click <strong>Add to Cart</strong>.
      </div>
    </div>

    <div class="sidebar-footer">
      <!-- USD Rate -->
      <div class="usd-rate-row">
        <label>USD Rate</label>
        <input type="number" id="usd-rate-input" value="34.00" min="0" step="0.01"
               oninput="updateCartTotals()">
        <span class="hint">THB/USD</span>
      </div>

      <!-- Commission -->
      <div class="commission-row">
        <label>Commission</label>
        <input type="number" id="commission-input" value="0" min="0" max="100" step="0.5"
               oninput="updateCartTotals()">
        <label style="font-size:12px;color:var(--muted2)">%</label>
      </div>

      <div class="sidebar-total">
        <span class="label">Total</span>
        <span class="amount" id="cart-total">฿0</span>
      </div>

      <div class="sidebar-actions">
        <button class="btn btn-danger-ghost btn-sm" onclick="clearCart()">Clear</button>
        <button class="btn btn-primary" onclick="showModal()" id="generate-btn" disabled>
          Generate Quote
        </button>
      </div>
    </div>
  </div>

</div>

<!-- ── MODAL ────────────────────────────────────────────────────────────────── -->
<div id="quotation-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-header">
      <h3>📋 Transfer & Attraction Quotation</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <pre class="quotation-pre" id="quotation-text"></pre>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Close</button>
      <button class="btn btn-ghost btn-sm" id="export-btn" onclick="exportToExcel()">
        ⬇ Export to Excel
      </button>
      <button class="btn btn-primary btn-sm" id="copy-btn" onclick="copyQuotation()">
        Copy to Clipboard
      </button>
    </div>
  </div>
</div>


<!-- ═══════════════════════════════════════════════════════════════════════════
     JAVASCRIPT
═══════════════════════════════════════════════════════════════════════════ -->
<script>
// ── STATE ─────────────────────────────────────────────────────────────────────
let fxRate       = null;
let cart         = [];
let selectedService = null;
let allResults   = [];
let searchTimeout = null;
let searchQuery  = '';
let attractionSearchResults = {};
let attractionSearchTimeouts = {};

// ── AUTH-AWARE FETCH ──────────────────────────────────────────────────────────
async function apiFetch(url) {
  const r = await fetch(url);
  if (r.status === 401) { 
    window.location.href = '/login'; 
    return null; 
  }
  return r;
}

// ── FX ────────────────────────────────────────────────────────────────────────
async function loadFx() {
  try {
    const r = await apiFetch('/quotation/api/fx');
    if (!r) return;
    const d = await r.json();
    fxRate = d.thb_per_usd;
    const el = document.getElementById('fx-label');
    if (fxRate) {
      el.textContent = `1 USD = ฿${fxRate.toFixed(2)}`;
      el.classList.add('loaded');
      document.getElementById('usd-rate-input').value = fxRate.toFixed(2);
    } else {
      el.textContent = 'FX unavailable';
    }
    updateCartTotals();
  } catch (e) {
    document.getElementById('fx-label').textContent = 'FX unavailable';
  }
}

function getUsdRate() {
  const rate = parseFloat(document.getElementById('usd-rate-input').value) || 34.00;
  return rate;
}

function thbToUsd(thb) {
  const rate = getUsdRate();
  return (rate && thb) ? (thb / rate).toFixed(2) : null;
}

// ── FILTERS ────────────────────────────────────────────────────────────────────
function applyFilters() {
  updateActiveFilters();
  if (searchQuery && searchQuery.length > 0) {
    doSearch();
  } else {
    doSearch();
  }
}

function updateActiveFilters() {
  const container = document.getElementById('active-filters');
  const city = document.getElementById('filter-city').value;
  const supplier = document.getElementById('filter-supplier').value;
  const type = document.getElementById('filter-type').value;
  
  let filters = [];
  if (city) filters.push({ label: `City: ${city}`, key: 'city', value: city });
  if (supplier) filters.push({ label: `Supplier: ${supplier}`, key: 'supplier', value: supplier });
  if (type) filters.push({ label: `Type: ${type}`, key: 'type', value: type });
  
  if (filters.length === 0) {
    container.innerHTML = '';
    document.getElementById('clear-filters-btn').classList.remove('has-filters');
    return;
  }
  
  document.getElementById('clear-filters-btn').classList.add('has-filters');
  
  container.innerHTML = filters.map(f => `
    <span class="filter-pill">
      ${f.label}
      <span class="remove" onclick="removeFilter('${f.key}')">×</span>
    </span>
  `).join('');
}

function removeFilter(key) {
  if (key === 'city') document.getElementById('filter-city').value = '';
  if (key === 'supplier') document.getElementById('filter-supplier').value = '';
  if (key === 'type') document.getElementById('filter-type').value = '';
  applyFilters();
}

function clearAllFilters() {
  document.getElementById('filter-city').value = '';
  document.getElementById('filter-supplier').value = '';
  document.getElementById('filter-type').value = '';
  updateActiveFilters();
  if (searchQuery && searchQuery.length > 0) {
    doSearch();
  }
}

// ── ATTRACTION SEARCH INSIDE TRANSFER CARD ──────────────────────────────────
function searchAttractionsForTransfer(serviceId, query) {
  const resultsContainer = document.getElementById(`attraction-results-${serviceId}`);
  if (!resultsContainer) return;
  
  clearTimeout(attractionSearchTimeouts[serviceId]);
  attractionSearchTimeouts[serviceId] = setTimeout(async () => {
    const q = query.trim();
    
    if (!q) {
      resultsContainer.innerHTML = `<div class="attraction-empty-inline">Type to search attractions…</div>`;
      return;
    }
    
    resultsContainer.innerHTML = `<div class="attraction-empty-inline">Searching…</div>`;
    
    const params = new URLSearchParams();
    params.append('q', q);
    params.append('limit', '20');
    
    try {
      const r = await apiFetch(`/quotation-attractions/api/quotation-attractions/search?${params.toString()}`);
      if (!r) return;
      const data = await r.json();
      attractionSearchResults[serviceId] = data;
      
      if (!data.length) {
        resultsContainer.innerHTML = `<div class="attraction-empty-inline">No attractions found</div>`;
        return;
      }
      
      resultsContainer.innerHTML = data.map(attr => {
        const adultPrice = attr.adult_net_price || 0;
        const childPrice = attr.child_net_price || 0;
        const seniorPrice = attr.senior_price || 0;
        const hasPax = attr._pax_selected || false;
        
        return `
          <div class="attraction-result-item" onclick="toggleAttractionPax(${serviceId}, ${attr.id})">
            <div class="info">
              <div class="name">${escHtml(attr.attraction_name)}</div>
              <div class="meta">${escHtml(attr.city)}${attr.supplier ? ` · ${escHtml(attr.supplier)}` : ''}</div>
            </div>
            <div class="price-info">
              ${adultPrice > 0 ? `Adult ฿${adultPrice.toLocaleString()}` : ''}
              ${childPrice > 0 ? ` · Child ฿${childPrice.toLocaleString()}` : ''}
              ${seniorPrice > 0 ? ` · Senior ฿${seniorPrice.toLocaleString()}` : ''}
            </div>
            <button class="add-btn ${hasPax ? 'added' : ''}" onclick="event.stopPropagation();toggleAttractionPax(${serviceId}, ${attr.id})">
              ${hasPax ? '✓' : '+'}
            </button>
          </div>
          <div class="attraction-pax-section" id="attraction-pax-${serviceId}-${attr.id}">
            <div class="pax-row">
              <div class="pax-group">
                <label>Adults</label>
                <input type="number" id="attr-adults-${serviceId}-${attr.id}" value="${attr._adults || 0}" min="0" max="20"
                       onchange="updateAttractionPax(${serviceId}, ${attr.id})">
              </div>
              <div class="pax-group">
                <label>Children</label>
                <input type="number" id="attr-children-${serviceId}-${attr.id}" value="${attr._children || 0}" min="0" max="20"
                       onchange="updateAttractionPax(${serviceId}, ${attr.id})">
              </div>
              <div class="pax-group">
                <label>Seniors</label>
                <input type="number" id="attr-seniors-${serviceId}-${attr.id}" value="${attr._seniors || 0}" min="0" max="20"
                       onchange="updateAttractionPax(${serviceId}, ${attr.id})">
              </div>
              <div class="pax-total" id="attr-total-${serviceId}-${attr.id}">
                Total: ${(attr._adults || 0) + (attr._children || 0) + (attr._seniors || 0)}
              </div>
            </div>
            <button class="attraction-add-btn" onclick="addAttractionToTransfer(${serviceId}, ${attr.id})">
              Add Attraction to Transfer
            </button>
            <div class="attraction-price-breakdown" id="attr-breakdown-${serviceId}-${attr.id}">
              ${formatAttractionPrice(attr)}
            </div>
          </div>
        `;
      }).join('');
      
      // Open pax section for any that were already selected
      data.forEach(attr => {
        if (attr._pax_selected) {
          const paxEl = document.getElementById(`attraction-pax-${serviceId}-${attr.id}`);
          if (paxEl) paxEl.classList.add('open');
        }
      });
      
    } catch (e) {
      console.error('Attraction search error:', e);
      resultsContainer.innerHTML = `<div class="attraction-empty-inline">Error searching attractions</div>`;
    }
  }, 300);
}

function formatAttractionPrice(attr) {
  const adultPrice = attr.adult_net_price || 0;
  const childPrice = attr.child_net_price || 0;
  const seniorPrice = attr.senior_price || 0;
  const adults = attr._adults || 0;
  const children = attr._children || 0;
  const seniors = attr._seniors || 0;
  
  const total = (adultPrice * adults) + (childPrice * children) + (seniorPrice * seniors);
  const parts = [];
  if (adults > 0 && adultPrice > 0) parts.push(`${adults} × ฿${adultPrice.toLocaleString()}`);
  if (children > 0 && childPrice > 0) parts.push(`${children} × ฿${childPrice.toLocaleString()}`);
  if (seniors > 0 && seniorPrice > 0) parts.push(`${seniors} × ฿${seniorPrice.toLocaleString()}`);
  
  return parts.length > 0 ? `Total: ฿${total.toLocaleString()} (${parts.join(' + ')})` : 'Select guests to see total';
}

function toggleAttractionPax(serviceId, attractionId) {
  const paxEl = document.getElementById(`attraction-pax-${serviceId}-${attractionId}`);
  if (!paxEl) return;
  
  const isOpen = paxEl.classList.contains('open');
  paxEl.classList.toggle('open');
  
  // Update the search results to reflect selection state
  const svc = allResults.find(s => s.id === serviceId);
  if (svc) {
    const attr = attractionSearchResults[serviceId]?.find(a => a.id === attractionId);
    if (attr) {
      attr._pax_selected = !isOpen;
      if (!isOpen) {
        // Initialize pax values if opening
        if (!attr._adults) attr._adults = 1;
        if (!attr._children) attr._children = 0;
        if (!attr._seniors) attr._seniors = 0;
        document.getElementById(`attr-adults-${serviceId}-${attractionId}`).value = attr._adults;
        document.getElementById(`attr-children-${serviceId}-${attractionId}`).value = attr._children;
        document.getElementById(`attr-seniors-${serviceId}-${attractionId}`).value = attr._seniors;
        updateAttractionPax(serviceId, attractionId);
      }
      // Re-render the result items to update the button state
      renderAttractionResults(serviceId);
    }
  }
}

function updateAttractionPax(serviceId, attractionId) {
  const svc = allResults.find(s => s.id === serviceId);
  if (!svc) return;
  
  const attr = attractionSearchResults[serviceId]?.find(a => a.id === attractionId);
  if (!attr) return;
  
  attr._adults = parseInt(document.getElementById(`attr-adults-${serviceId}-${attractionId}`).value) || 0;
  attr._children = parseInt(document.getElementById(`attr-children-${serviceId}-${attractionId}`).value) || 0;
  attr._seniors = parseInt(document.getElementById(`attr-seniors-${serviceId}-${attractionId}`).value) || 0;
  attr._pax_selected = (attr._adults + attr._children + attr._seniors) > 0;
  
  const total = attr._adults + attr._children + attr._seniors;
  document.getElementById(`attr-total-${serviceId}-${attractionId}`).textContent = `Total: ${total}`;
  document.getElementById(`attr-breakdown-${serviceId}-${attractionId}`).textContent = formatAttractionPrice(attr);
}

function renderAttractionResults(serviceId) {
  const resultsContainer = document.getElementById(`attraction-results-${serviceId}`);
  if (!resultsContainer) return;
  
  const data = attractionSearchResults[serviceId] || [];
  if (!data.length) return;
  
  resultsContainer.innerHTML = data.map(attr => {
    const adultPrice = attr.adult_net_price || 0;
    const childPrice = attr.child_net_price || 0;
    const seniorPrice = attr.senior_price || 0;
    const hasPax = attr._pax_selected || false;
    
    return `
      <div class="attraction-result-item" onclick="toggleAttractionPax(${serviceId}, ${attr.id})">
        <div class="info">
          <div class="name">${escHtml(attr.attraction_name)}</div>
          <div class="meta">${escHtml(attr.city)}${attr.supplier ? ` · ${escHtml(attr.supplier)}` : ''}</div>
        </div>
        <div class="price-info">
          ${adultPrice > 0 ? `Adult ฿${adultPrice.toLocaleString()}` : ''}
          ${childPrice > 0 ? ` · Child ฿${childPrice.toLocaleString()}` : ''}
          ${seniorPrice > 0 ? ` · Senior ฿${seniorPrice.toLocaleString()}` : ''}
        </div>
        <button class="add-btn ${hasPax ? 'added' : ''}" onclick="event.stopPropagation();toggleAttractionPax(${serviceId}, ${attr.id})">
          ${hasPax ? '✓' : '+'}
        </button>
      </div>
      <div class="attraction-pax-section ${hasPax ? 'open' : ''}" id="attraction-pax-${serviceId}-${attr.id}">
        <div class="pax-row">
          <div class="pax-group">
            <label>Adults</label>
            <input type="number" id="attr-adults-${serviceId}-${attr.id}" value="${attr._adults || 0}" min="0" max="20"
                   onchange="updateAttractionPax(${serviceId}, ${attr.id})">
          </div>
          <div class="pax-group">
            <label>Children</label>
            <input type="number" id="attr-children-${serviceId}-${attr.id}" value="${attr._children || 0}" min="0" max="20"
                   onchange="updateAttractionPax(${serviceId}, ${attr.id})">
          </div>
          <div class="pax-group">
            <label>Seniors</label>
            <input type="number" id="attr-seniors-${serviceId}-${attr.id}" value="${attr._seniors || 0}" min="0" max="20"
                   onchange="updateAttractionPax(${serviceId}, ${attr.id})">
          </div>
          <div class="pax-total" id="attr-total-${serviceId}-${attr.id}">
            Total: ${(attr._adults || 0) + (attr._children || 0) + (attr._seniors || 0)}
          </div>
        </div>
        <button class="attraction-add-btn" onclick="addAttractionToTransfer(${serviceId}, ${attr.id})">
          Add Attraction to Transfer
        </button>
        <div class="attraction-price-breakdown" id="attr-breakdown-${serviceId}-${attr.id}">
          ${formatAttractionPrice(attr)}
        </div>
      </div>
    `;
  }).join('');
}

function addAttractionToTransfer(serviceId, attractionId) {
  const svc = allResults.find(s => s.id === serviceId);
  if (!svc) return;
  
  const attr = attractionSearchResults[serviceId]?.find(a => a.id === attractionId);
  if (!attr) return;
  
  const adults = attr._adults || 0;
  const children = attr._children || 0;
  const seniors = attr._seniors || 0;
  
  if (adults + children + seniors === 0) {
    showToast('Select at least one guest.', 'error');
    return;
  }
  
  const adultPrice = attr.adult_net_price || 0;
  const childPrice = attr.child_net_price || 0;
  const seniorPrice = attr.senior_price || 0;
  const total = (adultPrice * adults) + (childPrice * children) + (seniorPrice * seniors);
  
  // Add to service's attractions
  if (!svc._attractions) svc._attractions = [];
  
  // Remove if already exists
  svc._attractions = svc._attractions.filter(a => a.id !== attractionId);
  
  svc._attractions.push({
    id: attractionId,
    name: attr.attraction_name,
    city: attr.city,
    adultPrice: adultPrice,
    childPrice: childPrice,
    seniorPrice: seniorPrice,
    adults: adults,
    children: children,
    seniors: seniors,
    total: total
  });
  
  // Update UI
  const card = document.querySelector(`.result-card[data-service-id="${serviceId}"]`);
  if (card) {
    const detail = card.querySelector('.service-detail');
    if (detail) {
      detail.innerHTML = renderServiceDetail(svc);
    }
  }
  
  // Update cart if this service is already in cart
  const cartItem = cart.find(item => item.serviceId === serviceId && item.type === 'transfer');
  if (cartItem) {
    cartItem.attractions = svc._attractions.map(a => ({...a}));
    cartItem.attractionTotal = svc._attractions.reduce((sum, a) => sum + a.total, 0);
    cartItem.totalPrice = cartItem.basePrice + cartItem.addonTotal + cartItem.attractionTotal;
    renderCart();
    updateCartTotals();
  }
  
  // Update the add button state
  const btn = document.querySelector(`.attraction-result-item .add-btn`);
  if (btn) {
    btn.textContent = '✓';
    btn.classList.add('added');
  }
}

// ── TRANSFER SEARCH ──────────────────────────────────────────────────────────
function handleSearchInput() {
  clearTimeout(searchTimeout);
  const q = document.getElementById('search-input').value.trim();
  searchQuery = q;
  
  const hint = document.getElementById('search-hint');
  if (q.length === 0) {
    hint.textContent = 'Search for transfer services by name, destination, supplier, or type';
    const hasFilters = document.getElementById('filter-city').value || 
                       document.getElementById('filter-supplier').value || 
                       document.getElementById('filter-type').value;
    if (hasFilters) {
      searchTimeout = setTimeout(() => doSearch(), 100);
    }
    return;
  }
  
  hint.textContent = 'Searching…';
  searchTimeout = setTimeout(() => doSearch(), 300);
}

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  const city = document.getElementById('filter-city').value;
  const supplier = document.getElementById('filter-supplier').value;
  const type = document.getElementById('filter-type').value;
  
  searchQuery = q;

  const spinner = document.getElementById('search-spinner');
  spinner.style.display = 'inline-block';

  const list = document.getElementById('results-list');
  list.innerHTML = `<div class="empty-state"><span class="spinner" style="margin-right:0;display:inline-block;width:24px;height:24px;border-width:3px"></span><br>Searching…</div>`;

  const params = new URLSearchParams();
  if (q) params.append('q', q);
  if (city) params.append('city', city);
  if (supplier) params.append('supplier', supplier);
  if (type) params.append('service_type', type);
  params.append('limit', '100');

  const url = `/quotation/api/search?${params.toString()}`;
  
  const r = await apiFetch(url);
  spinner.style.display = 'none';

  if (!r) return;
  
  try {
    const data = await r.json();

    if (data.error) {
      list.innerHTML = `<div class="empty-state">Error: ${data.error}</div>`;
      return;
    }

    allResults = data;
    for (const svc of allResults) {
      svc._selectedRate = null;
      svc._selectedAddons = [];
      svc._attractions = svc._attractions || [];
    }
    selectedService = null;

    document.getElementById('result-count').textContent = `${data.length} transfer${data.length > 1 ? 's' : ''}`;
    document.getElementById('clear-btn').style.display = data.length ? 'inline' : 'none';

    if (!data.length) {
      list.innerHTML = `<div class="empty-state">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        No transfers found
        <div class="sub">Try adjusting your search or filters</div>
      </div>`;
      return;
    }

    list.innerHTML = data.map((svc, i) => renderResultCard(svc, i)).join('');
  } catch (e) {
    console.error('Search error:', e);
    list.innerHTML = `<div class="empty-state">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="1.5">
        <circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>
      </svg>
      Couldn't load results
      <div class="sub">Something went wrong — try searching again</div>
    </div>`;
    showToast('Search failed — please try again', 'error');
  }
}

function clearResults() {
  document.getElementById('search-input').value = '';
  searchQuery = '';
  document.getElementById('results-list').innerHTML = '';
  document.getElementById('result-count').textContent = '';
  document.getElementById('clear-btn').style.display = 'none';
  document.getElementById('search-hint').textContent = 'Search for transfer services by name, destination, supplier, or type';
  allResults = [];
  selectedService = null;
  
  clearAllFilters();
}

// ── RENDER FUNCTIONS ──────────────────────────────────────────────────────────
function renderResultCard(svc, idx) {
  const isSelected = selectedService === svc.id;
  const pricePreview = svc.rates && svc.rates.length 
    ? `from ฿${Math.min(...svc.rates.map(r => r.price_thb)).toLocaleString()}`
    : 'No rates';

  const attractionCount = svc._attractions ? svc._attractions.length : 0;
  const attractionTotal = svc._attractions ? svc._attractions.reduce((sum, a) => sum + a.total, 0) : 0;
  const attractionNames = svc._attractions ? svc._attractions.map(a => a.name).join(', ') : '';

  return `
<div class="result-card ${isSelected ? 'selected' : ''}" 
     style="animation-delay:${Math.min(idx * 50, 400)}ms"
     data-service-id="${svc.id}">
  <div class="result-card-top" onclick="toggleService(${svc.id})">
    <div>
      <div class="result-card-name">🚐 ${escHtml(svc.name)}</div>
      <div class="result-card-meta">
        <span class="badge badge-dest">${escHtml(svc.destination)}</span>
        <span class="badge badge-transfer">${escHtml(svc.service_type)}</span>
        ${svc.supplier ? `<span class="badge" style="background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.1);color:var(--muted)">${escHtml(svc.supplier)}</span>` : ''}
        ${svc.tour_code ? `<span class="badge">${escHtml(svc.tour_code)}</span>` : ''}
        ${attractionCount > 0 ? `<span class="badge badge-attraction">🎟️ +${attractionCount} attraction${attractionCount > 1 ? 's' : ''}</span>` : ''}
      </div>
      ${attractionNames ? `<div style="font-size:11px;color:var(--muted2);margin-top:2px">${escHtml(attractionNames)}</div>` : ''}
    </div>
    <div class="result-card-price-preview">
      <strong>${pricePreview}</strong>
      ${attractionTotal > 0 ? `<div style="font-size:11px;color:var(--accent)">+ ฿${attractionTotal.toLocaleString()}</div>` : ''}
    </div>
  </div>
  <div class="service-detail">
    ${renderServiceDetail(svc)}
  </div>
</div>`;
}

function renderServiceDetail(svc) {
  const rates = svc.rates || [];
  const privateRates = rates.filter(r => r.rate_type === 'Private');
  const sicRates = rates.filter(r => r.rate_type === 'SIC');

  let html = '';

  // ── Transfer Rates ──
  if (privateRates.length) {
    html += `<div class="detail-section">
      <div class="detail-section-title">🚗 Private (per vehicle)</div>
      <div class="detail-rate-grid">`;
    const byVehicle = {};
    for (const r of privateRates) {
      const key = r.vehicle || 'N/A';
      if (!byVehicle[key]) byVehicle[key] = [];
      byVehicle[key].push(r);
    }
    for (const [vehicle, rows] of Object.entries(byVehicle)) {
      const bestPrice = Math.min(...rows.map(r => r.price_thb));
      const paxInfo = rows.map(r => r.pax_range).filter(Boolean).join(', ');
      const isSelected = svc._selectedRate && svc._selectedRate.vehicle === vehicle && svc._selectedRate.rateType === 'Private';
      html += `
        <div class="rate-option ${isSelected ? 'selected' : ''}" 
             onclick="event.stopPropagation();selectRate(${svc.id}, 'Private', '${escHtml(vehicle)}', ${bestPrice}, '${escHtml(paxInfo)}')">
          <div class="vehicle">${escHtml(vehicle)}</div>
          <div class="pax-info">${paxInfo || 'All pax'}</div>
          <div class="price">฿${bestPrice.toLocaleString()}</div>
        </div>`;
    }
    html += `</div></div>`;
  }

  if (sicRates.length) {
    html += `<div class="detail-section">
      <div class="detail-section-title">👥 SIC (per person, join tour)</div>
      <div class="detail-rate-grid">`;
    const adults = sicRates.find(r => r.pax_category === 'Adult');
    const children = sicRates.find(r => r.pax_category === 'Child');
    if (adults) {
      const isSelected = svc._selectedRate && svc._selectedRate.rateType === 'SIC' && svc._selectedRate.paxCategory === 'Adult';
      html += `
        <div class="rate-option ${isSelected ? 'selected' : ''}" 
             onclick="event.stopPropagation();selectRate(${svc.id}, 'SIC', 'Adult', ${adults.price_thb}, '')">
          <div class="vehicle">Adult</div>
          <div class="price">฿${adults.price_thb.toLocaleString()}</div>
        </div>`;
    }
    if (children) {
      const isSelected = svc._selectedRate && svc._selectedRate.rateType === 'SIC' && svc._selectedRate.paxCategory === 'Child';
      html += `
        <div class="rate-option ${isSelected ? 'selected' : ''}" 
             onclick="event.stopPropagation();selectRate(${svc.id}, 'SIC', 'Child', ${children.price_thb}, '')">
          <div class="vehicle">Child</div>
          <div class="price">฿${children.price_thb.toLocaleString()}</div>
        </div>`;
    }
    html += `</div></div>`;
  }

  // ── Add-ons ──
  if (svc.addons && svc.addons.length) {
    html += `<div class="detail-section detail-addons">
      <div class="detail-section-title">➕ Add-ons</div>`;
    for (const addon of svc.addons) {
      const price = addon.price_adult || addon.price_child || 0;
      const isChecked = svc._selectedAddons && svc._selectedAddons.some(a => a.name === addon.addon_name);
      html += `
        <div class="addon-option">
          <input type="checkbox" id="addon-${svc.id}-${addon.addon_name}" 
                 ${isChecked ? 'checked' : ''}
                 onchange="toggleAddon(${svc.id}, '${escHtml(addon.addon_name)}', ${price})">
          <label for="addon-${svc.id}-${addon.addon_name}">${escHtml(addon.addon_name)}</label>
          <span class="addon-price">฿${price.toLocaleString()}</span>
        </div>`;
    }
    html += `</div>`;
  }

  // ── Attractions Section ──
  const attractions = svc._attractions || [];
  html += `<div class="detail-attractions-section">
    <div class="section-header">
      <div class="label">
        🎟️ Attractions 
        <span class="count">${attractions.length}</span>
      </div>
    </div>
    
    ${attractions.map(attr => `
      <div class="added-attraction-item">
        <span class="name">${escHtml(attr.name)}</span>
        <span class="details">${attr.adults}A / ${attr.children}C / ${attr.seniors}S</span>
        <span class="price">฿${attr.total.toLocaleString()}</span>
        <button class="remove-btn" onclick="removeAttractionFromTransfer(${svc.id}, ${attr.id})" title="Remove">✕</button>
      </div>
    `).join('')}
    
    <div class="attraction-search-inline">
      <input type="text" id="attraction-search-${svc.id}" 
             placeholder="Search attractions to add…"
             oninput="searchAttractionsForTransfer(${svc.id}, this.value)">
      <button class="btn btn-xs btn-primary" onclick="searchAttractionsForTransfer(${svc.id}, document.getElementById('attraction-search-${svc.id}').value)">
        Search
      </button>
    </div>
    <div class="attraction-results-inline" id="attraction-results-${svc.id}">
      <div class="attraction-empty-inline">Type to search attractions…</div>
    </div>
  </div>`;

  // ── Notes ──
  if (svc.notes) {
    html += `<div style="font-size:12px;color:var(--muted);margin-top:8px">📝 ${escHtml(svc.notes)}</div>`;
  }

  // ── Add to Cart Button ──
  const hasSelected = svc._selectedRate !== null;
  const attractionTotal = attractions.reduce((sum, a) => sum + a.total, 0);
  const totalWithAttractions = hasSelected ? svc._selectedRate.price + attractionTotal : 0;
  
  const hintText = hasSelected 
    ? `Base: ฿${svc._selectedRate.price.toLocaleString()}${attractionTotal > 0 ? ` + Attractions: ฿${attractionTotal.toLocaleString()}` : ''} = ฿${totalWithAttractions.toLocaleString()}`
    : 'Select a rate above first';

  // Check if this service is already in cart
  const inCart = cart.some(item => item.serviceId === svc.id && item.type === 'transfer');

  html += `
    <button class="btn ${inCart ? 'btn-primary' : 'btn-primary'} detail-add-btn" id="add-btn-${svc.id}" 
            onclick="event.stopPropagation();addToCartFromDetail(${svc.id})" 
            ${!hasSelected ? 'disabled' : ''}>
      ${inCart ? '✓ Update Transfer in Cart' : 'Add Transfer to Cart'}
    </button>
    <div style="font-size:11px;color:var(--muted2);margin-top:4px;text-align:center" id="add-hint-${svc.id}">
      ${hintText}
    </div>`;

  return html;
}

// ── SERVICE INTERACTION ──────────────────────────────────────────────────────
function toggleService(id) {
  if (selectedService === id) {
    selectedService = null;
    const card = document.querySelector(`.result-card[data-service-id="${id}"]`);
    if (card) card.classList.remove('selected');
    return;
  }
  
  document.querySelectorAll('.result-card.selected').forEach(el => {
    el.classList.remove('selected');
  });
  
  selectedService = id;
  const card = document.querySelector(`.result-card[data-service-id="${id}"]`);
  if (card) {
    card.classList.add('selected');
  } else {
    return;
  }
  
  const svc = allResults.find(s => s.id === id);
  if (svc) {
    if (!svc._selectedRate) {
      document.getElementById(`add-btn-${id}`).disabled = true;
      const hint = document.getElementById(`add-hint-${id}`);
      if (hint) hint.textContent = 'Select a rate above first';
    } else {
      document.getElementById(`add-btn-${id}`).disabled = false;
      const attractionTotal = (svc._attractions || []).reduce((sum, a) => sum + a.total, 0);
      const hint = document.getElementById(`add-hint-${id}`);
      if (hint) hint.textContent = 
        `Base: ฿${svc._selectedRate.price.toLocaleString()}${attractionTotal > 0 ? ` + Attractions: ฿${attractionTotal.toLocaleString()}` : ''} = ฿${(svc._selectedRate.price + attractionTotal).toLocaleString()}`;
    }
  }
}

function selectRate(serviceId, rateType, vehicle, price, paxInfo) {
  const svc = allResults.find(s => s.id === serviceId);
  if (!svc) return;

  if (svc._selectedRate && 
      svc._selectedRate.rateType === rateType && 
      svc._selectedRate.vehicle === vehicle &&
      svc._selectedRate.price === price) {
    svc._selectedRate = null;
  } else {
    svc._selectedRate = { rateType, vehicle, paxInfo, price, paxCategory: vehicle };
  }

  const card = document.querySelector(`.result-card[data-service-id="${serviceId}"]`);
  if (card) {
    const detail = card.querySelector('.service-detail');
    if (detail) {
      detail.innerHTML = renderServiceDetail(svc);
    }
    if (svc._selectedRate) {
      card.classList.add('selected');
    }
  }

  const btn = document.getElementById(`add-btn-${serviceId}`);
  const hint = document.getElementById(`add-hint-${serviceId}`);
  if (svc._selectedRate) {
    const attractionTotal = (svc._attractions || []).reduce((sum, a) => sum + a.total, 0);
    if (btn) btn.disabled = false;
    if (hint) hint.textContent = 
      `Base: ฿${svc._selectedRate.price.toLocaleString()}${attractionTotal > 0 ? ` + Attractions: ฿${attractionTotal.toLocaleString()}` : ''} = ฿${(svc._selectedRate.price + attractionTotal).toLocaleString()}`;
  } else {
    if (btn) btn.disabled = true;
    if (hint) hint.textContent = 'Select a rate above first';
  }
}

function toggleAddon(serviceId, addonName, price) {
  const svc = allResults.find(s => s.id === serviceId);
  if (!svc) return;
  if (!svc._selectedAddons) svc._selectedAddons = [];
  
  const idx = svc._selectedAddons.findIndex(a => a.name === addonName);
  if (idx >= 0) {
    svc._selectedAddons.splice(idx, 1);
  } else {
    svc._selectedAddons.push({ name: addonName, price });
  }
}

function removeAttractionFromTransfer(serviceId, attractionId) {
  const svc = allResults.find(s => s.id === serviceId);
  if (!svc) return;
  
  svc._attractions = svc._attractions.filter(a => a.id !== attractionId);
  
  // Update the card
  const card = document.querySelector(`.result-card[data-service-id="${serviceId}"]`);
  if (card) {
    const detail = card.querySelector('.service-detail');
    if (detail) {
      detail.innerHTML = renderServiceDetail(svc);
    }
  }
  
  // Update cart if this service is in cart
  const cartItem = cart.find(item => item.serviceId === serviceId && item.type === 'transfer');
  if (cartItem) {
    cartItem.attractions = svc._attractions.map(a => ({...a}));
    cartItem.attractionTotal = svc._attractions.reduce((sum, a) => sum + a.total, 0);
    cartItem.totalPrice = cartItem.basePrice + cartItem.addonTotal + cartItem.attractionTotal;
    renderCart();
    updateCartTotals();
  }
  
  // Update the attraction search results to reflect removal
  const searchResults = attractionSearchResults[serviceId] || [];
  const attr = searchResults.find(a => a.id === attractionId);
  if (attr) {
    attr._pax_selected = false;
    attr._adults = 0;
    attr._children = 0;
    attr._seniors = 0;
  }
  renderAttractionResults(serviceId);
}

// ── ADD TRANSFER TO CART ─────────────────────────────────────────────────────
function addToCartFromDetail(serviceId) {
  const svc = allResults.find(s => s.id === serviceId);
  if (!svc) {
    showToast('Service not found.', 'error');
    return;
  }
  if (!svc._selectedRate) {
    showToast('Select a rate first.', 'error');
    return;
  }

  const { rateType, vehicle, price, paxCategory } = svc._selectedRate;
  const addons = svc._selectedAddons || [];
  const addonTotal = addons.reduce((sum, a) => sum + a.price, 0);
  const attractions = svc._attractions || [];
  const attractionTotal = attractions.reduce((sum, a) => sum + a.total, 0);
  
  // Remove any existing cart item for this service
  const existingIdx = cart.findIndex(item => item.serviceId === svc.id && item.type === 'transfer');
  if (existingIdx >= 0) {
    cart.splice(existingIdx, 1);
  }

  const cartItem = {
    id: Date.now() + Math.random(),
    type: 'transfer',
    serviceId: svc.id,
    name: svc.name,
    destination: svc.destination,
    serviceType: svc.service_type,
    rateType: rateType,
    vehicle: vehicle || paxCategory || 'N/A',
    basePrice: price,
    addons: [...addons],
    addonTotal: addonTotal,
    attractions: attractions.map(a => ({...a})),
    attractionTotal: attractionTotal,
    totalPrice: price + addonTotal + attractionTotal,
    quantity: 1,
  };

  cart.push(cartItem);
  renderCart();
  updateCartTotals();
  showToast(`Added "${svc.name}" to cart`, 'success');
  
  const btn = document.getElementById(`add-btn-${serviceId}`);
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = '✓ Added!';
    btn.style.background = 'var(--green)';
    btn.style.color = '#0a0a0f';
    setTimeout(() => {
      btn.textContent = orig;
      btn.style.background = '';
      btn.style.color = '';
    }, 1500);
  }
}

// ── CART ──────────────────────────────────────────────────────────────────────
function renderCart() {
  const container = document.getElementById('cart-items');
  const count = document.getElementById('cart-count');

  if (!cart.length) {
    container.innerHTML = `
      <div style="text-align:center;color:var(--muted2);font-size:13px;padding:40px 0;">
        No items added yet.<br>
        Search for transfers and click <strong>Add to Cart</strong>.
      </div>`;
    count.textContent = '0 items';
    document.getElementById('generate-btn').disabled = true;
    return;
  }

  count.textContent = `${cart.length} item${cart.length > 1 ? 's' : ''}`;
  document.getElementById('generate-btn').disabled = false;

  container.innerHTML = cart.map((item, idx) => {
    const usd = thbToUsd(item.totalPrice);
    
    // Transfer items
    const attractionDisplay = item.attractions && item.attractions.length ? 
      `<div class="cart-item-attractions">
        ${item.attractions.map(a => `
          <div class="cart-item-attraction">
            <span class="attraction-name">🎟️ ${escHtml(a.name)}</span>
            <span class="attraction-price">฿${a.total.toLocaleString()}</span>
          </div>
        `).join('')}
      </div>` : '';
    
    return `
    <div class="cart-item">
      <div class="cart-item-top">
        <div class="cart-item-name">🚐 ${escHtml(item.name)}</div>
        <button class="cart-item-remove" onclick="removeFromCart(${idx})" title="Remove">✕</button>
      </div>
      <div class="cart-item-details">
        <span>${escHtml(item.destination)}</span>
        <span>${escHtml(item.serviceType)}</span>
        <span>${escHtml(item.rateType)} · ${escHtml(item.vehicle)}</span>
      </div>
      ${item.addons.length ? `<div class="cart-item-details" style="color:var(--accent-dim)">+ ${item.addons.map(a => a.name).join(', ')}</div>` : ''}
      ${attractionDisplay}
      <div class="cart-item-price">
        ฿${item.totalPrice.toLocaleString()}
        ${usd ? `<span class="usd">≈ $${usd}</span>` : ''}
        <span class="breakdown">
          Base: ฿${item.basePrice.toLocaleString()}
          ${item.addonTotal > 0 ? `+ Add-ons: ฿${item.addonTotal.toLocaleString()}` : ''}
          ${item.attractionTotal > 0 ? `+ Attractions: ฿${item.attractionTotal.toLocaleString()}` : ''}
        </span>
      </div>
    </div>`;
  }).join('');
}

function removeFromCart(idx) {
  const item = cart[idx];
  cart.splice(idx, 1);
  renderCart();
  updateCartTotals();
  if (item) showToast(`Removed "${item.name}"`, 'default', 1800);
}

function clearCart() {
  // Clean up all transfer attractions
  for (const svc of allResults) {
    svc._attractions = [];
    svc._selectedRate = null;
    svc._selectedAddons = [];
  }
  cart = [];
  renderCart();
  updateCartTotals();
  
  for (const svc of allResults) {
    const btn = document.getElementById(`add-btn-${svc.id}`);
    if (btn) btn.disabled = true;
    const hint = document.getElementById(`add-hint-${svc.id}`);
    if (hint) hint.textContent = 'Select a rate above first';
  }
  document.querySelectorAll('.rate-option.selected').forEach(el => el.classList.remove('selected'));
  
  // Re-render all cards to reset attraction state
  document.querySelectorAll('.result-card').forEach(card => {
    const id = parseInt(card.dataset.serviceId);
    const svc = allResults.find(s => s.id === id);
    if (svc) {
      const detail = card.querySelector('.service-detail');
      if (detail) {
        detail.innerHTML = renderServiceDetail(svc);
      }
    }
  });
}

function roundToNearestHalf(value) {
  return Math.round(value * 2) / 2;
}

function updateCartTotals() {
  const comm = parseFloat(document.getElementById('commission-input').value) || 0;
  const subtotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
  const commissionAmount = comm === 0 ? 0 : subtotal * (comm / 100);
  const total = roundToNearestHalf(subtotal + commissionAmount);

  const usd = thbToUsd(total);
  document.getElementById('cart-total').innerHTML = `
    ฿${total.toLocaleString()}
    ${usd ? `<span class="usd">≈ $${usd}</span>` : ''}
  `;
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function showModal() {
  if (!cart.length) return;
  renderQuotationText();
  document.getElementById('quotation-modal').classList.add('visible');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('quotation-modal').classList.remove('visible');
  document.body.style.overflow = '';
}

function buildQuotationText() {
  const today = new Date().toLocaleDateString('en-GB', {
    day:'2-digit', month:'short', year:'numeric', timeZone:'Asia/Bangkok'
  });
  const comm = parseFloat(document.getElementById('commission-input').value) || 0;
  const usdRate = getUsdRate();
  const subtotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
  const commissionAmount = comm === 0 ? 0 : subtotal * (comm / 100);
  const grandTotal = roundToNearestHalf(subtotal + commissionAmount);

  const div = '─'.repeat(30);

  const lines = [
    `*VIKRAM — Transfer & Attraction Quotation*`,
    `Date: ${today}`,
    `USD Rate: 1 USD = ฿${usdRate.toFixed(2)}`,
    div, '',
  ];

  cart.forEach((item, i) => {
    const itemUsd = thbToUsd(item.totalPrice);
    
    lines.push(`*${i+1}. 🚐 ${item.name}*`);
    lines.push(`   Type: ${item.rateType} · ${item.vehicle}`);
    lines.push(`   ${item.destination} · ${item.serviceType}`);
    if (item.addons.length) {
      lines.push(`   Add-ons: ${item.addons.map(a => a.name).join(', ')}`);
    }
    if (item.attractions && item.attractions.length) {
      lines.push(`   Attractions:`);
      item.attractions.forEach(a => {
        lines.push(`      • ${a.name}: ${a.adults}A / ${a.children}C / ${a.seniors}S = ฿${a.total.toLocaleString()}`);
      });
    }
    const breakdown = [];
    breakdown.push(`Base: ฿${item.basePrice.toLocaleString()}`);
    if (item.addonTotal > 0) breakdown.push(`Add-ons: ฿${item.addonTotal.toLocaleString()}`);
    if (item.attractionTotal > 0) breakdown.push(`Attractions: ฿${item.attractionTotal.toLocaleString()}`);
    lines.push(`   ${breakdown.join(' | ')}`);
    lines.push(`   Subtotal: ฿${item.totalPrice.toLocaleString()}`);
    if (itemUsd) lines.push(`   ≈ $${itemUsd} USD`);
    lines.push('');
  });

  const grandUsd = thbToUsd(grandTotal);
  lines.push(div);
  lines.push(`Subtotal: ฿${subtotal.toLocaleString()}`);
  if (comm > 0) {
    lines.push(`Commission (${comm}%): ฿${commissionAmount.toLocaleString()}`);
  }
  lines.push(`*GRAND TOTAL: ฿${grandTotal.toLocaleString()}*`);
  if (grandUsd) lines.push(`*≈ $${grandUsd} USD*`);
  lines.push(div);
  lines.push('');
  return lines.join('\n');
}

function renderQuotationText() {
  document.getElementById('quotation-text').textContent = buildQuotationText();
}

async function copyQuotation() {
  const text = document.getElementById('quotation-text').textContent;
  const btn = document.getElementById('copy-btn');
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = Object.assign(document.createElement('textarea'), {
      value:text, style:'position:fixed;opacity:0'
    });
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
  }
  btn.textContent = '✓ Copied!';
  showToast('Quotation copied to clipboard', 'success');
  setTimeout(() => btn.textContent = 'Copy to Clipboard', 2200);
}

// ── EXCEL EXPORT ──────────────────────────────────────────────────────────────
function exportToExcel() {
  if (!cart.length) return;

  const today = new Date().toLocaleDateString('en-GB', {
    day: '2-digit', month: 'short', year: 'numeric', timeZone: 'Asia/Bangkok'
  });
  const fileDate = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' });
  const comm = parseFloat(document.getElementById('commission-input').value) || 0;
  const usdRate = getUsdRate();

  const subtotal = cart.reduce((s, it) => s + it.totalPrice, 0);
  const commissionAmount = comm === 0 ? 0 : subtotal * (comm / 100);
  const grandTotal = roundToNearestHalf(subtotal + commissionAmount);

  const describe = (it) => {
    let d = `🚐 ${it.name}`;
    const meta = [it.rateType, it.vehicle].filter(Boolean).join(' · ');
    if (meta) d += ` — ${meta}`;
    const place = [it.destination, it.serviceType].filter(Boolean).join(', ');
    if (place) d += ` (${place})`;
    if (it.addons && it.addons.length) d += ` + Add-ons: ${it.addons.map(a => a.name).join(', ')}`;
    if (it.attractions && it.attractions.length) {
      d += ` + Attractions: ${it.attractions.map(a => `${a.name} (${a.adults}A/${a.children}C/${a.seniors}S)`).join(', ')}`;
    }
    return d;
  };
  
  const usdVal = (thb) => { const u = parseFloat(thbToUsd(thb)); return isFinite(u) ? u : ''; };

  const aoa = [
    ['VIKRAM — Transfer & Attraction Quotation'],
    ['Date', today],
    [],
    ['Service', 'Price (THB)', 'Price (USD)'],
  ];
  
  cart.forEach((it) => aoa.push([describe(it), it.totalPrice, usdVal(it.totalPrice)]));
  aoa.push([]);
  aoa.push(['Subtotal', subtotal, usdVal(subtotal)]);
  if (comm > 0) aoa.push([`Commission (${comm}%)`, commissionAmount, '']);
  aoa.push(['GRAND TOTAL', grandTotal, usdVal(grandTotal)]);

  const filename = `VIKRAM_Quotation_${fileDate}.xlsx`;
  const btn = document.getElementById('export-btn');

  if (typeof XLSX !== 'undefined') {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 60 }, { wch: 14 }, { wch: 14 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Quotation');
    XLSX.writeFile(wb, filename);
  } else {
    exportCsvFallback(aoa, filename.replace(/\.xlsx$/, '.csv'));
  }

  if (btn) {
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ Exported!';
    setTimeout(() => { btn.innerHTML = orig; }, 2000);
  }
  showToast(`Exported ${filename}`, 'success');
}

function exportCsvFallback(aoa, filename) {
  const esc = (v) => {
    const s = (v == null ? '' : String(v));
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const csv = '\uFEFF' + aoa.map(row => row.map(esc).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── TOASTS ───────────────────────────────────────────────────────────────────
function showToast(message, kind = 'default', duration = 2600) {
  const stack = document.getElementById('toast-stack');
  if (!stack) return;

  const icons = {
    success: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    error:   '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>',
    default: ''
  };

  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.innerHTML = `${icons[kind] ? `<span class="toast-icon">${icons[kind]}</span>` : ''}<span>${escHtml(message)}</span>`;
  stack.appendChild(el);

  setTimeout(() => {
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 200);
  }, duration);
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function escHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadFx();

document.getElementById('search-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { 
    e.preventDefault(); 
    doSearch(); 
  }
});

document.addEventListener('click', (e) => {
  const sidebar = document.getElementById('sidebar');
  if (window.innerWidth <= 820 && sidebar.classList.contains('open')) {
    if (!sidebar.contains(e.target) && !e.target.closest('.sidebar-handle')) {
      sidebar.classList.remove('open');
    }
  }
});

updateActiveFilters();

// Auto-search on load
setTimeout(() => doSearch(), 300);
</script>
